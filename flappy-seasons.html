  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10}
  /* the page is exactly the viewport: canvas + caption are sized in fit() to fit inside it */
  /* position:fixed + inset:0 tracks the VISIBLE viewport on mobile (address bar
     shown or hidden) without relying on vh/dvh support */
  body{position:fixed;inset:0;box-sizing:border-box;padding:16px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    font:400 14px/1.5 "04b_19",ui-monospace,monospace;color:#7d8a94;letter-spacing:0}
  #stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  /* the scene canvas is painted at its own (capped) resolution and the browser scales it
     up on the GPU; the scanlines are a second canvas on top, drawn once per resize */
  #screen{flex:none;position:relative;overflow:hidden;background:#000;
    box-shadow:0 14px 44px rgba(0,0,0,.6);border-radius:3px}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
  #scan{position:absolute;left:0;top:0;pointer-events:none}
    /* just a revision tag: one short line, so the play area keeps the room */
  #hud{flex:none;text-align:center;text-transform:uppercase;white-space:nowrap;line-height:1;color:#4a545c}
  /* WIND control: a native range input (mouse, touch, keyboard all for free), log scale */
  #windctl{flex:none;display:flex;align-items:center;gap:10px;width:min(400px,100%);
    text-transform:uppercase;color:#e6edf3;user-select:none;-webkit-user-select:none}
  #windctl label{flex:none}
  #windval{flex:none;min-width:11ch;text-align:right;white-space:nowrap}
  /* DISCO: 60 s of every season at once, at x20 */
  #disco{flex:none;font:inherit;text-transform:uppercase;letter-spacing:0;cursor:pointer;
    padding:6px 8px;min-width:7ch;color:#ffe9ff;background:#3a1f4a;border:0;border-radius:0;
    box-shadow:inset 0 0 0 2px #000,inset -3px -3px 0 #24102e;-webkit-tap-highlight-color:transparent}
  /* TV (?tv): the world is as wide as the screen, nothing but the game, no pointer */
  body.tv{padding:0;gap:0;cursor:none}
  body.tv #windctl, body.tv #hud{display:none}
  body.tv #screen{box-shadow:none;border-radius:0}
  #disco:focus{outline:none}
  #disco:focus-visible{outline:2px solid #7fe8ff;outline-offset:2px}
  #disco.on{color:#000;animation:disco 0.8s steps(4) infinite}
  @keyframes disco{0%{background:#ff4fd8}25%{background:#ffe14a}50%{background:#4fe8ff}75%{background:#8aff5a}}
  #windval.storm{color:#ffb347} #windval.hurricane{color:#ff6b5b} #windval.off{color:#7d8a94}
  #wind{flex:1 1 auto;min-width:0;margin:0;height:36px;background:transparent;cursor:pointer;
    -webkit-appearance:none;appearance:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #wind:focus{outline:none}
  #wind:focus-visible{outline:2px solid #7fe8ff;outline-offset:2px}
  #wind::-webkit-slider-runnable-track{height:8px;background:linear-gradient(90deg,#4a3a30 0 30%,#a8641e 55%,#d8401a);
    box-shadow:inset 0 0 0 2px #000}
  #wind::-moz-range-track{height:8px;background:linear-gradient(90deg,#4a3a30 0 30%,#a8641e 55%,#d8401a);
    box-shadow:inset 0 0 0 2px #000}
  #wind::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:28px;margin-top:-10px;
    background:#ffd23f;border:0;border-radius:0;box-shadow:inset 0 0 0 2px #000,inset -4px -4px 0 #c99a10}
  #wind::-moz-range-thumb{width:18px;height:28px;background:#ffd23f;border:0;border-radius:0;
    box-shadow:inset 0 0 0 2px #000,inset -4px -4px 0 #c99a10}

<body>
<div id="stage"><div id="screen"><canvas id="game"></canvas><canvas id="scan"></canvas></div></div>
<div id="windctl"><label for="wind">env</label><input type="range" id="wind" min="0" max="1000" step="1" value="435"
  aria-valuetext="x1"><output id="windval" for="wind">x1</output><button id="disco" type="button"
  aria-pressed="false" title="60 seconds of every season, at x20">disco</button></div>
<div id="hud">seasons r36</div>

<script>
"use strict";

/* ============================================================
   GEOMETRY - 288x512 logical, base 288x112 -> sky 400. SKY is
   nudged to 399 so the horizon lands on a scan row.
   ============================================================ */
/* TV mode (?tv): the logical world is widened to the SCREEN's shape (not the window's,
   so going fullscreen changes nothing), 512 tall as always: on a 16:9 set that is 910
   wide and the picture fills it edge to edge. The controls and the caption go away. */
const TVS = /[?&]tvs(=|&|$)/.test(location.search);   // ?tvs: the same, scrolling as usual, the bird held in the middle
const TV = TVS || /[?&]tv(=|&|$)/.test(location.search);
const STAGE = TV && !TVS;                           // ?tv: still stages the bird flies across
function tvWidth() {
  let a = 0;
  try { a = screen.width / screen.height; } catch (e) {}
  try { const b = innerWidth / innerHeight; if (!(a > b)) a = b; } catch (e) {}
  return isFinite(a) && a > 0 ? Math.max(288, Math.min(1400, 2 * Math.round(256 * a))) : 288;
}
const W = TV ? tvWidth() : 288, H = 512, GROUND = 113;
const WK = W / 288;                                 // how much more world there is across than the usual
const reps = (n, span, gap) => TV ? Math.max(n, Math.ceil(span / gap)) : n;   // enough of a repeating thing to span a TV
const SKY = H - GROUND;

/* PHYSICS - per-frame values widely quoted for the original (gravity
   0.5 px/frame^2, flap -9 px/frame) converted to px/s. Unchanged from
   the previous build; NOT re-simulated in this edit (sandbox down). */
const GRAVITY = 1800;
const FLAP = 540;
const MAXVY = 560;
const FIXED = 1/120;
const COOLD = 0.34;         // > FLAP/GRAVITY = 0.30s, so the bird cannot hover

const BIRD_X = 80;
const STAGE_END = 70;       // ?tv: the bird is this far from the right edge when the next stage pops up
const TVS_FLY = 3;          // ?tvs: s for the bird to fly in from the left to the middle, where it stays
const BW = 17, BH = 12;     // hand-authored sprite
const BS = 2;               // sprite is drawn 2x: 34x24 on screen
const SPR_W = BW * BS, SPR_H = BH * BS;
const HW = 10, HH = 8;      // hitbox 20x16, forgiving inside the sprite as the original's is

/* PIPE - shaft 52 (pipe.png is 52x320). Lip overhang and lip height are
   now ratios of the shaft, measured off the reference: lip = 1.24x shaft,
   lip height = 0.40x shaft. */
const PIPE_W = 52;
const CAP_X = 6;                    // lip overhang per side

function step(dt) {
  cosAcc += dt; cosDt = 0;
  if (lastSub) { cosDt = cosAcc; cosAcc = 0; }
  flash = Math.max(0, flash - dt * 3);
  airClock += dt;
  stepDisco(dt);
  stepSeason(dt);                  // the seasons turn through the crash too
  stepClock(dt); stepShooting(dt); // and the days
  stepDish(dt);
  setWindMul(envWind() * windX * SFX.wind);
  if (windMul > 0) stepWind(dt);   // the wind keeps blowing through the crash
  stepSun(dt);                     // the sun, the smoke and the dust go on through the crash
  stepFlair(dt);                   // and the life in the background
  if (dead) {
    gspd = 0;                      // ...but the world no longer scrolls
    cloudX += -airU * 0.3 * dt;
    stepCover(dt); stepStorm(dt);
    if (cosDt) { stepSmoke(cosDt); stepTrail(cosDt); stepRain(cosDt); stepAir(cosDt); }
    stepFeathers(dt); stepBoom(dt); stepDeath(dt); return;
  }
  stepFeathers(dt);
  clock += dt; stageT += dt;
  ramp(score);

  // headwind slows the ground speed, tailwind speeds it up (capped)
  const sc = storm > 0 ? WIND.spdCap * 2 + (STORM.spd - WIND.spdCap * 2) * storm
                       : WIND.spdCap * Math.max(1, physMul);
  vrun = speed * (1 + Math.max(-sc, Math.min(sc, airU * WIND.spdPerU)));   // the bird's speed through the world
  gspd = STAGE ? 0 : vrun;            // ...which is how fast the world scrolls by, except on a TV stage, where the bird crosses it
  dist += gspd * dt;
  if (TVS) { flyT += dt; homeX = BIRD_X + (W / 2 - BIRD_X) * smooth(flyT / TVS_FLY); }   // out to the middle, then it holds there
  if (STAGE) { homeX += vrun * dt; birdX += vrun * dt; if (homeX > W - STAGE_END) nextStage(); }   // the bird carries itself across
  cloudX += (14 - airU * 0.3) * dt;

  // pipes are spaced by DISTANCE, so wind never squeezes two gates together
  since += vrun * dt;
  if (since >= speed * spaceSec) { since = 0; spawn(); quakeSpawn(); }

  if (windMul > 0) {
    curSince += vrun * dt;
    if (curSince >= curNext) { curSince = 0; curNext = randIn(WIND.curGap); spawnCurrent(); }
  }
  for (const c of currents) c.x += (airU * 0.15 - gspd) * dt;
  currents = currents.filter(c => c.x + c.w / 2 > -10);
  for (const c of cacti) c.x -= gspd * dt;
  cacti = cacti.filter(c => c.x + 30 > 0);
  if (cosDt) stepSmoke(cosDt);
  stepCover(dt);
  if (cosDt) stepRain(cosDt);
  stepStorm(dt);

  // what the bird feels: capped lift/sink plus a zero-mean wobble in gusts and at column edges
  windAt(birdX, bird.y);
  const cap = storm > 0 ? WIND.aCap * 2 + (STORM.aCap - WIND.aCap * 2) * storm   // storm: up to 36% of gravity
                        : WIND.aCap * Math.max(1, physMul);
  aBird = Math.max(-cap, Math.min(cap, WA.a));
  let edge = 0;
  for (const c of currents) { const f = currentF(c, birdX); edge = Math.max(edge, 4 * f * (1 - f)); }
  const tm = Math.min(1, gustE + edge) * WIND.turb * physMul;
  let turb = tm * 0.5 * (Math.sin(airClock * 7.3) + Math.sin(airClock * 11.9 + 1.7));
  if (storm > 0) {                 // storm buffeting: slow, heavy, irregular shoves up and down
    const n = (Math.sin(airClock * 2.3) + Math.sin(airClock * 3.9 + 1.1) + Math.sin(airClock * 1.4 + 2.6)) / 3;
    turb += storm * STORM.buffet * (0.5 + 0.8 * gustE) * n;
  }
  // a headwind pushes the bird back, a tailwind forward: a few px, a lot in a storm
  const dr = WIND.drift + (STORM.drift - WIND.drift) * storm;
  const sway = storm * 8 * Math.sin(airClock * 1.7) * (0.4 + gustE);
  const tx = homeX + Math.max(-1, Math.min(1, airU / (45 + 100 * storm))) * dr + sway;
  birdX += (tx - birdX) * (1 - Math.exp(-dt / (0.6 - 0.35 * storm)));
  aFelt = storm > 0 ? aBird + turb : aBird;   // in a storm the autopilot feels the shove it is in

  cooldown -= dt;
  let n = null;
  for (const p of pipes) { if (p.x + PIPE_W > birdX - HW) { n = p; break; } }
  if (!n && quake && quake.fell) n = quakeAim();
  stepHeat(dt);
  stepIce(dt);
  plowCover();
  if (n && cooldown <= 0 && wantFlap(n)) {
    bird.vy = -flapEff;                          // a cooked (or iced) bird beats weaker
    flaps++; skin = Math.min(1, skin + HEAT.flap * sunK() * SFX.sun);
    shedIce();
    cooldown = COOLD;
    wingHold = 0.16;
    frameIdx = 0; frameT = 0;
  }

  frameT += dt;
  const rate = (cooldown > 0 ? 0.13 : 0.09) * (1 - 0.45 * Math.min(1, rime + glaze));   // beating harder against the ice
  if (frameT > rate) {
    frameT = 0;
    if (wingHold > 0) wingHold -= rate; else frameIdx = (frameIdx + 1) % 4;
  }

  bird.vy = Math.min(bird.vy + (gEff + aBird + turb) * dt, MAXVY);
  bird.y += bird.vy * dt;

  for (const p of pipes) {
    p.x -= gspd * dt;
    if (!p.passed && p.x + PIPE_W < birdX - HW) { p.passed = true; score++; if (score > best) best = score; }
  }
  pipes = pipes.filter(p => p.x + PIPE_W + CAP_X > -REACH);
  stepQuake(dt);                   // after the pipes move: the fallen ones keep pace
  if (cosDt) { stepAir(cosDt); stepTrail(cosDt); }   // after the pipes move, so nothing is left overlapping one

  if (bird.y + HH >= SKY || bird.y - HH <= 0) { die(birdX, bird.y + (bird.y > SKY / 2 ? HH : -HH), "ground"); return; }
  if (!quake || quake.rose) for (const p of pipes) {   // from the first rumble the pipes cannot hurt it
    if (birdX + HW > p.x && birdX - HW < p.x + PIPE_W &&
        (bird.y - HH < p.top || bird.y + HH > p.bot)) {
      const face = birdX < p.x;                      // into the side of it, or onto a lip?
      die(face ? p.x : birdX, face ? bird.y : bird.y < p.top + 1 ? p.top : p.bot, "pipe"); return;
    }
  }
}

/* TV: the stage is still and the bird flies across it; near the right edge the next
   stage pops up - the whole world moves one stage left, under the camera, and the bird
   is back at the left. The ground, the hills, the power line, the critters all come
   from dist, so they move with it; the things kept in screen space are shifted. */
function nextStage() {
  const S = homeX - BIRD_X;
  dist += S; homeX -= S; birdX -= S;
  for (const p of pipes) p.x -= S;
  for (const f of fallen) if (!pipes.includes(f.p)) f.p.x -= S;
  for (const c of cacti) c.x -= S;
  for (const c of currents) c.x -= S;
  for (const a of [feathers, sweat, chips]) for (const q of a) q.x -= S;
  trail = []; sparks = [];                         // its smoke stays with it
  if (hawk) {
    const h = hawk; h.x -= S; h.cx -= S;
    for (const P of [h.P0, h.P1, h.P2]) if (P) P[0] -= S;
  }
  if (ufo) { ufo.x -= S; ufo.hx -= S; if (ufo.bx0 !== undefined) ufo.bx0 -= S; }
  for (const w of waves) w.x -= S;
  pipes = pipes.filter(p => p.x + PIPE_W + CAP_X > -REACH);
  stageN++; stageT = 0;
}

function birdRot() { return bird.vy < -60 ? -0.26 : Math.min(0.80, bird.vy / 620); }

function die(ix, iy, kind) {
  dead = true; deadT = 0; flash = 1;
  recordRun(struck ? "zap" : grabbed ? "hawk" : abducted ? "ufo" : kind === "ground" && iy < SKY / 2 ? "ceiling" : kind || "pipe");
  if (!struck && !grabbed && !abducted) startBoom(ix === undefined ? birdX : ix, iy === undefined ? bird.y : iy, kind || "pipe");
  deathRot = birdRot();
  bird.vy = 0;
  spawnFeathers(birdX, bird.y, abducted ? 6 : struck || grabbed ? 34 : 100, abducted ? 0.4 : struck || grabbed ? 1 : 1.5);   // a crash blows it apart
  const chips = Math.round(30 * Math.min(1, rime + glaze));   // and the ice shatters off
  for (let i = 0; i < chips; i++) {
    const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 220;
    feathers.push({ x: birdX + (Math.random() * 2 - 1) * 10, y: bird.y + (Math.random() * 2 - 1) * 7,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, rot: Math.random() * 3, vr: (Math.random() * 2 - 1) * 14,
      ph: Math.random() * 6, fr: 6, len: 2 + (Math.random() * 3 | 0), col: Math.random() < 0.5 ? "#c9f0ff" : "#ffffff" });
  }
}

/* ---------- STATS - kept in the browser across visits: how many runs, how each
   one ended, the average score at each ENV setting (bracketed like the slider's
   labels: off, low, the x1 default, up to x2, harsh, extreme) and the best ever.
   Shown after every death, under the banner, while the next run waits. ?resetstats clears them. */
const STATS_KEY = "flappy-stats";
const DEATHS = [["pipe", "PIPE"], ["ground", "GROUND"], ["ceiling", "CEILING"], ["zap", "LIGHTNING"], ["hawk", "HAWK"], ["ufo", "ALIENS"]];
const ENV_BR = [["OFF", v => v <= 0], ["x0.1-1", v => v < 1], ["x1", v => v === 1], ["x1-2", v => v <= 2], ["x2-20", v => v < 20], ["x20", () => true]];
function freshStats() { const d = {}; for (const [k] of DEATHS) d[k] = 0; return { runs: 0, max: 0, d, e: ENV_BR.map(() => [0, 0, 0]) }; }
const stats = (() => {
  const s = freshStats();
  if (qflag("resetstats")) { try { localStorage.removeItem(STATS_KEY); } catch (e) {} return s; }
  try {
    const o = JSON.parse(localStorage.getItem(STATS_KEY));
    if (o) {
      s.runs = +o.runs || 0; s.max = +o.max || 0;
      for (const [k] of DEATHS) s.d[k] = o.d && +o.d[k] || 0;
      if (Array.isArray(o.e)) s.e.forEach((r, i) => { const q = o.e[i]; if (Array.isArray(q)) for (let j = 0; j < 3; j++) r[j] = +q[j] || 0; });
    }
  } catch (e) {}
  return s;
})();
let lastKind = "", lastBr = -1;                     // how and where this run ended: lit up on the card
function recordRun(kind) {                          // one run over: how it ended, and at what ENV
  stats.runs++;
  stats.d[kind] = (stats.d[kind] || 0) + 1; lastKind = kind;
  stats.max = Math.max(stats.max, score);
  lastBr = ENV_BR.findIndex(b => b[1](sunMul));
  const r = stats.e[lastBr];
  r[0] += score; r[1]++; r[2] = Math.max(r[2], score);
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
}
function drawStats() {                              // the card after a death, under the banner
  if (!dead || offT <= 0) return;
  const a = Math.min(1, offT / 0.25, (D_REST - offT) / 0.3);
  const pw = 248, x0 = Math.round(W / 2 - pw / 2), y0 = 186, L = 17;
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(14,20,36,.72)"; ctx.fillRect(x0, y0, pw, 14 * L + 14);
  ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.fillRect(x0, y0, pw, 1); ctx.fillRect(x0, y0 + 14 * L + 13, pw, 1);
  const W1 = "#ffffff", DIM = "#9fb0bd", HD = "#ffe9a0";
  let y = y0 + 18;
  txt("RUNS " + stats.runs, x0 + 8, y, W1, F.hud, "left");
  txt("MAX SCORE " + stats.max, x0 + pw - 8, y, "#ffd27a", F.hud, "right");
  y += L + 6; txt("DEATHS", x0 + 8, y, HD, F.hud, "left");
  for (let i = 0; i < DEATHS.length; i++) {
    const [k, n] = DEATHS[i], c = i % 2, xl = x0 + 8 + c * 122, xr = x0 + 116 + c * 124;
    if (c === 0) y += L;
    txt(n, xl, y, k === lastKind ? "#ff8a5a" : DIM, F.hud, "left");
    txt(String(stats.d[k]), xr, y, k === lastKind ? "#ff8a5a" : W1, F.hud, "right");
  }
  y += L + 6;
  const cx = [x0 + 8, x0 + 148, x0 + 196, x0 + pw - 8];
  txt("ENV", cx[0], y, HD, F.hud, "left");
  txt("AVG", cx[1], y, HD, F.hud, "right"); txt("RUNS", cx[2], y, HD, F.hud, "right"); txt("MAX", cx[3], y, HD, F.hud, "right");
  ENV_BR.forEach(([n], i) => {
    const [sum, cnt, mx] = stats.e[i], on = lastBr === i;
    y += L;
    txt(n, cx[0], y, on ? "#9fffb0" : DIM, F.hud, "left");
    txt(cnt ? (sum / cnt).toFixed(1) : "-", cx[1], y, cnt ? W1 : DIM, F.hud, "right");
    txt(String(cnt), cx[2], y, cnt ? W1 : DIM, F.hud, "right");
    txt(cnt ? String(mx) : "-", cx[3], y, cnt ? W1 : DIM, F.hud, "right");
  });
  ctx.globalAlpha = 1;
}

const FEATHER_COLS = [C.birdY, C.birdY, C.birdD, C.birdC, "#ffffff"];
function spawnFeathers(x, y, n = 34, vm = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (70 + Math.random() * 230) * vm;
    feathers.push({
      x: x + (Math.random() * 2 - 1) * 8,
      y: y + (Math.random() * 2 - 1) * 6,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 90,           // bias upward so they puff out, then drift down
      rot: Math.random() * Math.PI,
      vr: (Math.random() * 2 - 1) * 9,
      ph: Math.random() * Math.PI * 2,
      fr: 4 + Math.random() * 4,
      len: Math.random() < 0.35 ? 6 : 4,
      col: FEATHER_COLS[(Math.random() * FEATHER_COLS.length) | 0]
    });
  }
}

function stepFeathers(dt) {
  if (!feathers.length) return;
  const drag = Math.exp(-3.2 * dt);
  for (const f of feathers) {
    f.vx *= drag;
    f.vy = Math.min(f.vy * drag + 420 * dt, 55);   // light: low terminal velocity
    f.ph += f.fr * dt;
    windAt(f.x, f.y);                               // carried by the wind
    f.x += (f.vx + Math.sin(f.ph) * 28 + (WA.u - gspd) * 0.9) * dt;   // + side-to-side flutter
    f.y += (f.vy + WA.a * 0.15) * dt;
    f.rot += (f.vr + Math.cos(f.ph) * 3) * dt;
  }
  feathers = feathers.filter(f => f.y < H + 10 && f.x > -20 && f.x < W + 20);
}

function makeBolts() {
  const out = [];
  const n = 3 + ((Math.random() * 3) | 0);
  for (let b = 0; b < n; b++) {
    let a = Math.random() * Math.PI * 2;
    let x = birdX + Math.cos(a) * 8, y = bird.y + Math.sin(a) * 6;
    const pts = [[Math.round(x), Math.round(y)]];
    const segs = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < segs; i++) {
      a += (Math.random() * 2 - 1) * 0.9;
      const l = 6 + Math.random() * 8;
      x += Math.cos(a) * l; y += Math.sin(a) * l;
      pts.push([Math.round(x), Math.round(y)]);
    }
    out.push(pts);
  }
  return out;
}

function stepDeath(dt) {
  deadT += dt;
  if (abducted) { if (stepAbducted()) { offT += dt; if (offT > D_REST) reset(); } return; }   // up the beam
  if (grabbed) {                                // carried off in the talons, struggling
    if (hawk) { birdX = hawk.x; bird.y = hawk.y + hawkHold(hawkQ(hawk)); frameIdx = ((deadT * 14) | 0) % 4; }
    else { offT += dt; if (offT > D_REST) reset(); }
    return;
  }
  if (deadT < D_FREEZE) return;                 // frozen in place
  if (struck && deadT < D_ZAP) {                // electrocution: lightning only
    zapT -= dt;
    if (zapT <= 0) {
      zapT = 0.045 + Math.random() * 0.03;
      zapOn = !zapOn;
      bolts = makeBolts();
      jit = [Math.round((Math.random() * 2 - 1) * 2), Math.round((Math.random() * 2 - 1) * 2)];
      if (Math.random() < 0.35) flash = Math.max(flash, 0.45);
    }
    return;
  }
  if (!falling) {                               // flip and drop
    falling = true; fallT = deadT; bolts = []; zapOn = false; jit = [0, 0];
    bird.vy = -D_HOP;
  }
  bird.vy = Math.min(bird.vy + GRAVITY * dt, 900);
  bird.y += bird.vy * dt;
  if (bird.y - SPR_H > H) { offT += dt; if (offT > D_REST) reset(); }
}

/* ============================================================
   SUMMER - the sun and the shade, heat in the bird, smoke, dust, cacti
   ============================================================ */
function wander(o, dt, lo, hi, every, tau) {          // a value drifting between lo and hi
  o.next -= dt;
  if (o.next <= 0) { o.next = every * (0.6 + 0.8 * Math.random()); o.target = lo + Math.random() * (hi - lo); }
  o.k += (o.target - o.k) * (1 - Math.exp(-dt / tau));
}
function stepSun(dt) {
  sunPh += dt * 2 * Math.PI / SUN.period;
  sunSX = NOCLOCK ? SUN.swing * Math.sin(sunPh) : -SUN.swing * Math.cos(Math.PI * (hour - 6) / 12);   // long shadows morning and evening
  wander(dustW, dt, 0.5, 1.7, 10, 3);                  // dust storms come and go
  wander(smokeW, dt, 0.5, 1.5, 14, 5);                 // so does the smoke from the fires
  if (skyEv.t > 0) { skyEv.t -= dt; if (skyEv.t <= 0) { skyEv.target = 1; skyEv.next = randIn(SKYEV.every); } }
  else if ((skyEv.next -= dt) <= 0) {
    if (Math.random() < SKYEV.blazeP) { skyEv.target = SKYEV.blaze; skyEv.t = randIn(SKYEV.blazeDur); }
    else { skyEv.target = randIn(SKYEV.cloud); skyEv.t = randIn(SKYEV.cloudDur); skyEv.dir = sgn(); }
  }
  skyEv.k += (skyEv.target - skyEv.k) * (1 - Math.exp(-dt / SKYEV.tau));
}
function stepRain(dt) {
  const spr = SW[0];
  if (shower.t > 0) {
    shower.t -= dt;
    if (shower.t <= 0) { shower.next = randIn(RAIN.every); if (spr > 0.3) bow = 10; }   // it passes: look for the rainbow
  } else if (spr > 0.3 && (shower.next -= dt) <= 0) {
    shower.t = randIn(RAIN.dur);
    skyEv.target = randIn([0.3, 0.5]); skyEv.t = shower.t + 1.5; skyEv.dir = sgn();   // a rain cloud over the sun
  }
  const rGoal = Math.max(shower.t > 0 ? Math.min(1, spr * 1.5) : 0, TSTORM.rain * ts.I);   // a shower, or the storm
  rainK += (rGoal - rainK) * (1 - Math.exp(-dt / 1.5));
  bow = Math.max(0, bow - dt);
  const flow = (visU(airU) - gspd) * 0.8;
  let n = rainK * RAIN.rate * WK * dt;                     // drops only come in from above the screen, upwind enough
  const lead = Math.max(0, -flow) * SKY / RAIN.speed, trail = Math.max(0, flow) * SKY / RAIN.speed;
  for (; n > 0; n--) if (Math.random() < n && rain.length < RAIN.max * WK * (1 + ts.I))
    rain.push({ x: -trail - 4 + Math.random() * (W + lead + trail + 8), y: -6 - Math.random() * 20, vy: RAIN.speed + Math.random() * 60 });
  const nearG = SKY - Math.max(2.1 * coverD(), waterD) - 2;   // nothing can stand higher than this
  for (const d of rain) {
    d.x += flow * dt; d.y += d.vy * dt; d.sl = flow / d.vy;
    const X = Math.round(d.x), Y = Math.round(d.y);
    const gh = Y >= nearG ? groundCoverH(d.x) : 0, sh = Math.max(gh, waterD);          // the ground, or the water standing on it
    if (Y >= SKY - sh) { d.dead = 1; splash(X, Math.round(SKY - sh) - 1, waterD > gh ? "rgba(200,225,255,.9)" : groundSplash()); continue; }
    for (const p of pipes) {                          // the pipes are solid: it splashes where it hits
      if (X < p.x - CAP_X - 2 || X > p.x + PIPE_W + CAP_X + 2) continue;
      pipeRects(p);
      if (hitsRects(X, Y, 0, 1, 4, 0)) { d.dead = 1; splash(X, Y - 4); break; }
    }
  }
  rain = rain.filter(d => !d.dead && d.x > -80 && d.x < W + 80);
  for (const q of splashes) { q.age += dt; q.x -= gspd * dt; }
  splashes = splashes.filter(q => q.age < 0.18);
}
function stormWindow() {                          // [start, length] on the season clock: over the summer/autumn turn
  const d = Math.min(TSTORM.dur, SEASON.len * 0.75);
  return [2 * SEASON.len - SEASON.fade - d * 0.45, d];
}
const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
function stepStorm(dt) {
  const [s0, d] = stormWindow(), p = (seasonT - s0) / d;
  ts.on = p >= 0 && p < 1; ts.p = ts.on ? p : 0;
  const goal = ts.on ? smooth(Math.min(p / 0.15, (1 - p) / 0.12)) : 0;
  ts.I += (goal - ts.I) * (1 - Math.exp(-dt / 0.8));
  ts.D = ts.on ? 1 - smooth((p - 0.08) / 0.55) : 1;    // how far off the lightning is: 1 the horizon, 0 overhead
  if (ts.I > 0.2) { skyEv.target = 0.22; skyEv.t = Math.max(skyEv.t, 1.5); skyEv.dir = skyEv.dir || 1; }   // no sun in a storm
  ts.flash = Math.max(0, ts.flash - dt * 5); ts.sky = Math.max(0, ts.sky - dt * 4);
  if (ts.on && p > 0.05 && p < 0.9 && (ts.next -= dt) <= 0) {
    const r = ts.D + (Math.random() - 0.5) * 0.3;
    const layer = r > 0.6 ? 0 : r > 0.22 ? 1 : 2;
    ts.next = randIn(layer === 2 ? [0.6, 1.5] : [0.35, 1.2]);   // near strikes are spaced out: never 3 flashes a second
    const q = layer === 1 && Math.random() < POLE.wireP ? lineTarget() : null;
    strike(q ? 3 : layer, q);                         // the line on its poles draws some of the mid strikes
  }
  if (ts.on && ts.I > 0.4 && ts.p > 0.05 && ts.p < 0.9) {   // anything up out of the ground draws the lightning
    const c = critterUp();
    if (c && !c.crit.zapTried) { c.crit.zapTried = true; if (Math.random() < FRY.p) { strike(2, c); ts.next = Math.max(ts.next, 0.8); } }
  }

function drawBird() {

function boltLine(x0, y0, x1, y1, s, col) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;

  for (let i = 0; i <= n; i++) {

}

function drawBolts() {

function outlineText(s, x, y, col, font) {
  ctx.font = font;
  const w = ctx.measureText(s).width;
  const x0 = Math.round(x - w / 2), y0 = Math.round(y);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.ink;
  for (const d of [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,1]]) ctx.fillText(s, x0 + d[0], y0 + d[1]);
  ctx.fillStyle = col;
  ctx.fillText(s, x0, y0);

/* ============================================================
   FLAIR - life going on in the background, every once in a while:
   a goods train along the horizon, a blimp, buzzards circling in
   summer, geese going over in spring and autumn, a flock wheeling
   about, a yeti on the winter hills, a groundhog in spring (that
   ducks back if it sees its shadow), a woodpecker working on a pipe
   in autumn, gophers digging under the ground. All scenery: none of
   it touches the bird. ?flair=0 turns it off, ?flair=4 is 4x as often.
   ============================================================ */
const FLAIR_MUL = qnum("flair") !== null ? Math.max(0, qnum("flair")) : 1;
const FL = { train: [35, 75], blimp: [45, 95], buzz: [11, 24], geese: [16, 34], flock: [18, 38],
             yeti: [9, 18], hog: [7, 14], gopher: [45, 90], hawk: [30, 60], peck: 0.2 };   // s between sightings; peck = share of cacti
const flNext = { train: 14, blimp: 30, buzz: 6, geese: 10, flock: 16, yeti: 4, hog: 3, gopher: 20, hawk: 25 };
let train = null, blimp = null, flocks = [], yeti = null, hog = null, gophers = [], chips = [], puffs = [];
const NEAR_P = 0.14;                                // the near hills' parallax
function nearHillX(i) { return Math.round((((i * 40) - dist * NEAR_P) % (W + 60) + W + 60) % (W + 60) - 30); }

const TINT = new Map();
function tint(col, k) {                             // darkened toward the storm's sky colour
  if (k < 0.01) return col;
  const q = Math.round(k * 40), key = col + q;
  let v = TINT.get(key);
  if (!v) { if (TINT.size > 3000) TINT.clear(); v = mixHex(col, "#10142a", q / 40); TINT.set(key, v); }
  return v;
}
function skyDk() { return TSTORM.dark * ts.I; }
function spr(rows, pal, x, y, flip, k, clipY, s = 1) {   // a cell is s logical px; nothing at or below clipY
  x = Math.round(x); y = Math.round(y);
  const w = rows[0].length, cy = clipY === undefined ? 1e9 : clipY;
  for (let r = 0; r < rows.length; r++) {
    const ry = y + r * s, h = Math.min(s, cy - ry);
    if (h <= 0) break;
    const row = rows[r];
    for (let c = 0; c < w; c++) {
      const ch = row[c]; if (ch === ".") continue;
      ctx.fillStyle = tint(pal[ch], k);
      ctx.fillRect(x + (flip ? w - 1 - c : c) * s, ry, s, h);
    }
  }
}

/* ---------- scheduling ---------- */
function stepFlair(dt) {
  if (FLAIR_MUL > 0) for (const k in flNext)
    if ((flNext[k] -= dt * FLAIR_MUL * (k === "gopher" && ts.I > 0.4 ? 4 : 1)) <= 0) flNext[k] = trySpawn(k) ? randIn(FL[k]) : 2 + 3 * Math.random();
  stepTrain(dt); stepBlimp(dt); stepFlocks(dt); stepYeti(dt); stepHog(dt); stepGophers(dt); stepChips(dt); stepHawk(dt); stepPoles(dt); stepUfo(dt);
}
function trySpawn(k) {
  const r = Math.random(), has = kind => flocks.some(f => f.kind === kind);
  switch (k) {
    case "train":  if (train) return false; train = makeTrain(); return true;
    case "blimp":  if (blimp || ts.I > 0.05 || rainK > 0.5) return false; blimp = makeBlimp(); return true;
    case "buzz":   if (has("buzz") || r > SW[1] + 0.4 * SW[2]) return false; flocks.push(makeBuzz()); return true;
    case "geese":  if (has("geese") || r > 0.9 * (SW[0] + SW[2])) return false; flocks.push(makeGeese()); return true;
    case "flock":  if (has("flock") || r > 1 - 0.7 * SW[3]) return false; flocks.push(makeFlock()); return true;
    case "yeti":   if (yeti || r > SW[3]) return false; return !!(yeti = makeYeti());
    case "hog":    if (hog || r > Math.max(SW[0], 0.8 * ts.I)) return false; hog = makeHog(); return true;   // spring, or up to see the storm
    case "gopher": if (gophers.length || r > 1 - 0.5 * SW[3]) return false; gophers.push(makeGopher()); return true;
    case "hawk":   if (hawk || dead || !fineWeather() || hawkRoom() < 16) return false; hawk = makeHawk(); return true;
  }
  return false;
}
function hillSlot() {                               // a near hill well onto the screen, with time to spare
  const ok = [];
  for (let i = 0, n = reps(9, W + 60, 40); i < n; i++) { const x = nearHillX(i); if (x > 130 && x < W - 40) ok.push(i); }
  return ok.length ? ok[(Math.random() * ok.length) | 0] : -1;
}

/* ---------- the train: along the horizon, between the far hills and the near ones ---------- */
const TRAIN_COLS = [["#9a3e28", "#62261a"], ["#d0a43a", "#8e6e22"], ["#3e6e94", "#24485e"], ["#6e7e3a", "#46521f"], ["#8e8a84", "#5e5a56"]];
const TRAIN_Y = SKY - 27;                           // top of the engine: the wheels run just behind the near hilltops
function makeTrain() {
  const dir = sgn(), n = 4 + (Math.random() * 5 | 0), units = [{ t: "eng", w: 22 }, { t: "tend", w: 10 }];
  for (let i = 0; i < n; i++) units.push({ t: Math.random() < 0.3 ? "tank" : "box", w: 16, c: TRAIN_COLS[(Math.random() * TRAIN_COLS.length) | 0] });
  units.push({ t: "cab", w: 16, c: ["#c03a2c", "#7e221a"] });
  let len = 0; for (const u of units) { u.off = len; len += u.w + 1; }
  return { dir, units, len, v: 34 + Math.random() * 14, x: dir > 0 ? -len - 4 : W + 4, puffT: 0, t: 0 };
}
function unitX(u) { return train.dir < 0 ? train.x + u.off : train.x + train.len - u.off - u.w; }
function stepTrain(dt) {
  for (const p of puffs) { p.age += dt; p.x += (airU * 0.3 - gspd * 0.1) * dt; p.y -= (7 + 3 * p.age) * dt; }
  puffs = puffs.filter(p => p.age < p.life);
  if (!train) return;
  const tr = train; tr.t += dt;
  tr.x += (tr.dir * tr.v - gspd * 0.1) * dt;
  if ((tr.puffT -= dt) <= 0 && puffs.length < 40) {
    tr.puffT = 0.16 + Math.random() * 0.1;
    const ex = unitX(tr.units[0]);
    puffs.push({ x: ex + (tr.dir < 0 ? 5 : 16), y: TRAIN_Y - 1, age: 0, life: 1.8 + Math.random() * 0.8 });
  }
  if (tr.dir < 0 ? tr.x + tr.len < -12 : tr.x > W + 12) train = null;
}
function drawTrain() {
  const k = skyDk();
  for (const p of puffs) {                          // smoke from the stack, thinning as it climbs
    const s = 2 + Math.round(p.age * 2);
    ctx.globalAlpha = 0.55 * (1 - p.age / p.life);
    px(p.x - s / 2, p.y - s / 2, s, s, tint("#8a8a92", k));
  }
  ctx.globalAlpha = 1;
  if (!train) return;
  const tr = train, y = TRAIN_Y, snow = SFX.snow > 0.5 && snowD > 1;
  for (const u of tr.units) {
    const ux = Math.round(unitX(u));
    if (ux > W || ux + u.w < 0) continue;
    const R = (dx, dy, w, h, col) => px(tr.dir < 0 ? ux + dx : ux + u.w - dx - w, y + dy, w, h, tint(col, k));
    if (u.t === "eng") {
      R(4, 0, 3, 3, "#1e1e24"); R(3, 0, 5, 1, "#1e1e24");                 // stack
      R(9, 1, 3, 2, "#2e2e36");                                          // dome
      R(2, 3, 13, 5, "#2a2a32"); R(2, 3, 13, 1, "#4c4c58");              // boiler
      R(14, 0, 8, 1, "#1e1e24"); R(15, 1, 7, 7, "#8a2c22"); R(17, 2, 3, 3, "#ffd86a");   // cab, lit window
      R(0, 7, 3, 2, "#5a5a62"); R(1, 3, 1, 2, "#fff6c0");               // cowcatcher, lamp
      R(1, 8, 21, 1, "#141418");
      R(2, 9, 2, 2, "#3a3a42"); for (const wx of [6, 10, 14]) R(wx, 9, 3, 2, "#3a3a42");
      R(6 + ((tr.t * 8) | 0) % 3 * 4, 9, 9, 1, "#8a8a94");              // the rod, going round
      if (snow) R(15, 0, 7, 1, "#f4f8fc");
    } else if (u.t === "tend") {
      R(0, 3, 10, 5, "#2a2a32"); R(1, 2, 8, 1, "#141414"); R(0, 8, 10, 1, "#141418");
      R(1, 9, 3, 2, "#3a3a42"); R(6, 9, 3, 2, "#3a3a42");
    } else {
      const [a, b] = u.c;
      if (u.t === "box") { R(0, 1, 16, 7, a); R(0, 1, 16, 1, b); R(6, 2, 4, 5, b); if (snow) R(0, 0, 16, 1, "#f4f8fc"); }
      else if (u.t === "tank") { R(1, 3, 14, 5, a); R(0, 4, 16, 3, a); R(1, 3, 14, 1, "#d8d8d8"); R(7, 2, 2, 1, b); if (snow) R(2, 2, 12, 1, "#f4f8fc"); }
      else { R(1, 2, 14, 6, a); R(5, 0, 6, 2, a); R(4, 0, 8, 1, b); R(3, 3, 2, 2, "#ffd86a"); R(11, 3, 2, 2, "#ffd86a"); if (snow) R(4, -1, 8, 1, "#f4f8fc"); }
      R(0, 8, 16, 1, "#141418"); R(1, 9, 3, 2, "#3a3a42"); R(12, 9, 3, 2, "#3a3a42");
    }
  }
}

/* ---------- the blimp: slow, high, behind the clouds ---------- */
function makeBlimp() { const dir = sgn(); return { dir, x: dir > 0 ? -40 : W + 40, y: 36 + Math.random() * 90, v: 9 + Math.random() * 6, t: 0 }; }
function stepBlimp(dt) {
  if (!blimp) return;
  const b = blimp; b.t += dt;
  b.x += (b.dir * b.v + airU * 0.12 - gspd * 0.03) * dt;
  if (b.x < -60 || b.x > W + 60) blimp = null;
}
function drawBlimp() {
  if (!blimp) return;
  const b = blimp, d = b.dir, cx = Math.round(b.x), cy = Math.round(b.y + 2 * Math.sin(b.t * 0.6));
  const tail = cx - d * 22;
  for (let r = -8; r <= 8; r++) {                   // tail fins, red, top and bottom
    const a = Math.abs(r); if (a < 5) continue;
    const w = 13 - a; px(d > 0 ? tail - 3 : tail + 3 - w, cy + r, w, 1, "#b8342a");
  }
  for (let r = -7; r <= 7; r++) {                   // the envelope: an outline, then lit top, body, shade
    const hw = Math.round(24 * Math.sqrt(1 - (r / 7.6) ** 2));
    px(cx - hw - 1, cy + r, 2 * hw + 2, 1, "#56606c");
  }
  for (let r = -6; r <= 6; r++) {
    const hw = Math.round(24 * Math.sqrt(1 - (r / 7.6) ** 2)) - 1;
    px(cx - hw, cy + r, 2 * hw, 1, r < -3 ? "#eef2f6" : r < 3 ? "#c8d0d8" : "#98a2ae");
  }
  px(d > 0 ? tail - 3 : tail - 6, cy, 10, 1, "#8e2a22");             // the side fin, edge on
  px(cx + d * 6 - 3, cy - 3, 6, 5, "#f8e018"); px(cx + d * 6 - 2, cy - 4, 4, 7, "#f8e018");   // a yellow bird on the side
  px(cx + d * 6 + (d > 0 ? 1 : -2), cy - 2, 1, 1, "#20242a"); px(cx + d * 6 + (d > 0 ? 3 : -4), cy, 2, 1, "#e8483a");
  px(cx - 6, cy + 7, 12, 3, "#4e5864");             // the gondola
  for (let i = 0; i < 3; i++) px(cx - 4 + i * 3, cy + 8, 1, 1, "#ffd86a");
  if ((b.t * 20 | 0) % 2) px(cx - d * 8, cy + 6, 1, 4, "#c8d0d8");   // the propeller
  if ((b.t * 1.2 % 1) < 0.15) px(tail, cy - 9, 1, 1, "#ff3a2a");     // nav light
}

/* ---------- birds in the sky ---------- */
const BUZZ = [["K.........K", ".KK.....KK.", "...KKKKK...", "...HK......"],    // soaring, on a dihedral
              ["...........", "KKKKKKKKKKK", "...KKKKK...", "...HK......"]];   // a lazy flap
const GOOSE = [["K...K.", ".KKKKK"], [".KKKKK", "K...K."]];
function makeBuzz() {
  const n = 2 + (Math.random() * 3 | 0), b = [];
  for (let i = 0; i < n; i++) b.push({ ph: i * 6.283 / n + Math.random() * 0.6, rr: 0.7 + Math.random() * 0.5, w: 0.45 + Math.random() * 0.2, fl: Math.random() * 9 });
  return { kind: "buzz", cx: W + 50, cy: 60 + Math.random() * 90, r: 24 + Math.random() * 14, t: 0, b };
}
function makeGeese() { const dir = sgn(); return { kind: "geese", dir, x: dir > 0 ? -60 : W + 60, y: 28 + Math.random() * 80, v: 34 + Math.random() * 10, t: 0, n: 5 + (Math.random() * 5 | 0) }; }
function makeFlock() {
  const n = 12 + (Math.random() * 9 | 0), b = [];
  for (let i = 0; i < n; i++) b.push({ ph: Math.random() * 6.283, f1: 0.8 + Math.random() * 0.4, f2: 0.8 + Math.random() * 0.5 });
  return { kind: "flock", cx: W + 40, cy: 50 + Math.random() * 100, t: 0, b };
}
function stepFlocks(dt) {
  for (const f of flocks) {
    f.t += dt;
    if (f.kind === "geese") f.x += (f.dir * f.v - gspd * 0.07) * dt;
    else f.cx += (airU * 0.08 - gspd * (f.kind === "buzz" ? 0.08 : 0.1) - 4) * dt;
  }
  flocks = flocks.filter(f => f.kind === "geese" ? (f.dir > 0 ? f.x < W + 60 + f.n * 5 : f.x > -60 - f.n * 5) : f.cx > -70);
}
function drawFlocks() {
  for (const f of flocks) {

/* ---------- the groundhog: up out of the spring grass; if it sees its shadow, straight back down ---------- */
const HOG = ["..BBBB..", ".BBBBBB.", ".BEBBEB.", ".BBNNBB.", "..BTTB..", ".BLLLLB.", "BBLLLLBB", ".BLLLLB.", ".BLLLLB.", ".BBBBBB."];

function clearOfPipes(x, pad) {                     // screen x clear of every pipe, lips and all
  return pipes.every(p => x < p.x - CAP_X - pad || x > p.x + PIPE_W + CAP_X + pad);
}

/* ---------- the woodpecker: a desert one, hammering at a saguaro in summer ---------- */

/* ---------- struck by lightning: the classic cartoon X-ray, skeleton and body flashing in turn,

/* ---------- gophers: a cutaway of the ground, a tunnel dug as you watch, and up for a look ---------- */
const GOPHER = ["..BBBBB..", ".BBBBBBEB", "BBBBBBBBN", "BLLLLBBTB", ".BBBBBBB.", ".C.C.C.C."];

function makeGopher() {                            // each its own way: depth, pace, wiggle, and what it does at the end
  const y = SKY + 66 + Math.random() * 32, r = Math.random();
  return { gx: openGround(W + 12, 12) + dist, y, ty: y, v: 16 + Math.random() * 26, wig: 4 + Math.random() * 18, t: 0,
           up: 0.25 + Math.random() * 1.1, slant: Math.random() * 40, end: r < 0.55 ? "peek" : r < 0.8 ? "turn" : "deep",
           mode: "dig", tun: [], peek: 0 };

      g.y += Math.sign(g.ty - g.y) * g.wig * dt;

    for (const [wx, y] of g.tun) { const x = Math.round(wx - dist); if (x > -8 && x < W + 8) px(x - 6, y - 8, 12, 16, rim); }
    for (const [wx, y] of g.tun) { const x = Math.round(wx - dist); if (x > -8 && x < W + 8) px(x - 5, y - 7, 10, 14, tc); }

/* ---------- the hawk: in fine weather it circles high, and now and then stoops.

reset();

   at 50 Hz a steady 2-2-3 judder). That time is then split into equal sub-steps of
   at most 1/120 s - at 60 Hz exactly the old two 1/120 s steps. At most 0.1 s a

                  "SIM " + (pf.st / pf.n).toFixed(1) + " DRAW " + (pf.dr / pf.n).toFixed(1) + " " + buf.width + "X" + buf.height + " " + RENDERER];

requestAnimationFrame(loop);
