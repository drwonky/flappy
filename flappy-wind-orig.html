<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="hud">autopilot, no input. <b>air currents</b>: headwinds, <b>updrafts</b> and <b>downdrafts</b> nudge the bird; leaves, dust and swirls show the wind<span id="windnote"></span></div>

<script>
"use strict";

/* ============================================================
   GEOMETRY - 288x512 logical, base 288x112 -> sky 400. SKY is
   nudged to 399 so the horizon lands on a scan row.
   ============================================================ */
const W = 288, H = 512, GROUND = 113;
const SKY = H - GROUND;

/* PHYSICS - per-frame values widely quoted for the original (gravity
   0.5 px/frame^2, flap -9 px/frame) converted to px/s. Unchanged from
   the previous build; NOT re-simulated in this edit (sandbox down). */
const GRAVITY = 1800;
const FLAP = 540;
const MAXVY = 560;
const FIXED = 1/120;
const COOLD = 0.34;         // > FLAP/GRAVITY = 0.30s, so the bird cannot hover

const BIRD_X = 80;
const BW = 17, BH = 12;     // hand-authored sprite
const BS = 2;               // sprite is drawn 2x: 34x24 on screen
const SPR_W = BW * BS, SPR_H = BH * BS;
const HW = 10, HH = 8;      // hitbox 20x16, forgiving inside the sprite as the original's is

/* PIPE - shaft 52 (pipe.png is 52x320). Lip overhang and lip height are
   now ratios of the shaft, measured off the reference: lip = 1.24x shaft,
   lip height = 0.40x shaft. */
const PIPE_W = 52;
const CAP_X = 6;                    // lip overhang per side
const CAP_W = PIPE_W + 2 * CAP_X;   // 64
const CAP_H = 20;
const GAP0 = 140, GAP1 = 104;       // floor raised from 96: the bird is 16 tall now

const SPEED0 = 130, SPEED1 = 200;
const SPACE0 = 1.30, SPACE1 = 0.95;
const TAU = 85;

const K = 0.30;
const MARGIN_FRAC = 0.06;
const WOBBLE_FRAC = 0.12;

/* ============================================================
   AIR CURRENTS - every effect is capped so it NUDGES the bird, never
   decides a gate.
     u = horizontal air speed, px/s   (+ tailwind, - headwind)
     a = vertical accel on the bird, px/s^2   (- lift, + sink)
   Three layers: a slowly wandering prevailing wind, short gusts, and
   updraft / downdraft columns that belong to the world and scroll with it.
   ?wind=0 turns it all off (same RNG stream as the calm game), ?wind=2..5
   exaggerates it for viewing.
   ============================================================ */
const WIND = {
  baseMax: 28, baseEvery: [3, 7], baseTau: 1.5,     // prevailing wind
  gustRate: 0.15, gustAmp: 20, gustDur: [0.6, 1.8], // gusts
  curGap: [220, 520], curW: [70, 130],              // vertical currents
  upS: [110, 160], downS: [90, 130], upFrac: 0.55,
  aCap: 0.09 * GRAVITY,                             // lift / sink cap: 9% of gravity
  spdCap: 0.12, spdPerU: 0.12 / 45,                 // ground speed: at most +-12%
  drift: 5,                                         // bird x shift at full wind, px
  turb: 60                                          // turbulence wobble, px/s^2
};
const windMul = (() => {
  try {
    const v = parseFloat(new URLSearchParams(location.search).get("wind"));
    return isFinite(v) && v >= 0 ? Math.min(v, 5) : 1;
  } catch (e) { return 1; }
})();
/* the bird's physics stop growing at x2 so the demo stays flyable; above that
   only the visuals (leaves, dust, swirls) get busier */
const physMul = Math.min(2, windMul);
const AIR_MAX = 320;                                // particle pool
const LEAF_COLS = [["#7fbf4d","#3d6e1f"], ["#a9b94a","#5d6620"], ["#e89a3a","#8a4d14"],
                   ["#b07a44","#5a3a1c"], ["#d8603a","#7a2a14"]];
const DUST_COLS = ["#ded895", "#f3efc8", "#c3bb6d"];
/* leaf poses, 3x2 cells of 2x2 px: B body, D stem/edge. Cycling them tumbles the leaf. */
const LEAF_POSES = [["BB.", ".BD"], ["BBD", "..."], [".BB", "DB."], ["DBB", "..."]];

const C = {
  skyA:"#6cc5de", skyB:"#9adcec", skyC:"#c6ecf2", skyD:"#e4f6f7",
  cloud:"#eef7fa", hill:"#7fbf4d", hillDark:"#5f9a38",
  grass:"#74bf2e", grassDark:"#4e8f21",
  sand:"#ded895", sandDark:"#c3bb6d",
  pipeO:"#14200f", pipeLt:"#8ed04a", pipeHi:"#74bf2e", pipeMid:"#5aa81f", pipeLo:"#3d7a12",
  ink:"#1a2419",
  birdY:"#f8e018", birdD:"#d9a90f", birdC:"#f5f2c0",
  eye:"#ffffff", pupil:"#20242a", beak:"#e8483a", beakLo:"#b62f26"
};

/* ============================================================
   PIPE BANDS - the structure that reads as a Mario warp pipe.
   Both lists are x-offsets from the LEFT EDGE OF THE LIP, so the
   highlight column lands at the same absolute x in lip and shaft.
   The shaft's extra structure is absent: no dashes, no rivets.
   ============================================================ */
const SHAFT_BANDS = [   // drawn at x, width PIPE_W
  [CAP_X,      1, C.pipeO],    // outline
  [CAP_X + 1,  6, C.pipeLt],   // left catch-light
  [CAP_X + 7, 11, C.pipeHi],   // highlight
  [CAP_X + 18, 18, C.pipeMid], // body
  [CAP_X + 36, 15, C.pipeLo],  // shadow
  [CAP_X + 51,  1, C.pipeO]    // outline
];
const LIP_BANDS = [     // drawn at x - CAP_X, width CAP_W
  [0,  1, C.pipeO],
  [1,  12, C.pipeLt],   // left bands match the shaft exactly
  [13, 11, C.pipeHi],
  [24, 18, C.pipeMid],
  [42, 20, C.pipeLo],   // the overhang lands in the shadow - that IS the turn
  [62,  1, C.pipeO],
  [63,  1, C.pipeO]
];

let bird, pipes, score = 0, best = 0, cooldown = 0, since = 1e9, aimOff = 0;
let dead = false, deadT = 0, flash = 0, clock = 0;
let frameIdx = 0, frameT = 0, wingHold = 0;
let speed = SPEED0, gap = GAP0, spaceSec = SPACE0;

/* ---------- death sequence ----------
   0 .. D_FREEZE        : world and bird frozen, feathers burst out
   D_FREEZE .. D_ZAP    : electrocution - palette flicker, jitter, bolts, flashes
   D_ZAP ..             : bird flips upside down, small hop, falls off screen */
const D_FREEZE = 0.22, D_ZAP = 1.15, D_HOP = 240, D_REST = 0.8;
let feathers = [], bolts = [], zapT = 0, zapOn = false, jit = [0, 0];
let falling = false, offT = 0, deathRot = 0;

/* air state */
let wind = { u: 0, target: 0, next: 0 }, gusts = [], currents = [], airParts = [];
let airU = 0, gustE = 0, aBird = 0, airClock = 0;
let birdX = BIRD_X, gspd = SPEED0, dist = 0, cloudX = 0, curSince = 0, curNext = 300;
const WA = { u: 0, a: 0 };                          // windAt() result, reused


function ramp(sc) {
  const k = 1 - Math.exp(-sc / TAU);
  speed = SPEED0 + (SPEED1 - SPEED0) * k;
  gap = GAP0 + (GAP1 - GAP0) * k;
  spaceSec = SPACE0 + (SPACE1 - SPACE0) * k;
}
const usable = () => gap - 2 * HH;

function reset() {
  bird = { y: H * 0.42, vy: 0 };
  pipes = [];
  score = 0; cooldown = 0; since = 1e9; aimOff = 0;
  dead = false; deadT = 0; flash = 0;
  frameIdx = 0; frameT = 0; wingHold = 0;
  feathers = []; bolts = []; zapT = 0; zapOn = false; jit = [0, 0];
  falling = false; offT = 0; deathRot = 0;
  wind = { u: 0, target: 0, next: 0 }; gusts = []; currents = []; airParts = [];
  airU = 0; gustE = 0; aBird = 0; birdX = BIRD_X; curSince = 0; curNext = 300;
  ramp(0); gspd = speed;
}

function spawn() {
  const top = 30 + Math.random() * (SKY - 60 - gap);
  pipes.push({ x: W, top: top, bot: top + gap, passed: false });
  aimOff = (Math.random() * 2 - 1) * usable() * WOBBLE_FRAC;
}

function wantFlap(n) {
  // aim a touch higher in sinking air, a touch lower in rising air
  const target = (n.top + n.bot) / 2 + aimOff - aBird * 0.02;
  if ((bird.y - target) + K * bird.vy <= 0) return false;
  // the flap's apex under the gravity the bird actually feels right now
  const apex = bird.y - (FLAP * FLAP) / (2 * (GRAVITY + aBird));
  return apex >= n.top + HH + usable() * MARGIN_FRAC;
}

function step(dt) {
  flash = Math.max(0, flash - dt * 3);
  airClock += dt;
  if (windMul > 0) stepWind(dt);   // the wind keeps blowing through the crash
  if (dead) {
    gspd = 0;                      // ...but the world no longer scrolls
    cloudX += -airU * 0.3 * dt;
    stepAir(dt); stepFeathers(dt); stepDeath(dt); return;
  }
  stepFeathers(dt);
  clock += dt;
  ramp(score);

  // headwind slows the ground speed, tailwind speeds it up (capped)
  const sc = WIND.spdCap * Math.max(1, physMul);
  gspd = speed * (1 + Math.max(-sc, Math.min(sc, airU * WIND.spdPerU)));
  dist += gspd * dt;
  cloudX += (14 - airU * 0.3) * dt;

  // pipes are spaced by DISTANCE, so wind never squeezes two gates together
  since += gspd * dt;
  if (since >= speed * spaceSec) { since = 0; spawn(); }

  if (windMul > 0) {
    curSince += gspd * dt;
    if (curSince >= curNext) { curSince = 0; curNext = randIn(WIND.curGap); spawnCurrent(); }
  }
  for (const c of currents) c.x += (airU * 0.15 - gspd) * dt;
  currents = currents.filter(c => c.x + c.w / 2 > -10);

  // what the bird feels: capped lift/sink plus a zero-mean wobble in gusts and at column edges
  windAt(birdX, bird.y);
  const cap = WIND.aCap * Math.max(1, physMul);
  aBird = Math.max(-cap, Math.min(cap, WA.a));
  let edge = 0;
  for (const c of currents) { const f = currentF(c, birdX); edge = Math.max(edge, 4 * f * (1 - f)); }
  const tm = Math.min(1, gustE + edge) * WIND.turb * physMul;
  const turb = tm * 0.5 * (Math.sin(airClock * 7.3) + Math.sin(airClock * 11.9 + 1.7));
  // a headwind pushes the bird back a few px, a tailwind forward
  const tx = BIRD_X + Math.max(-1, Math.min(1, airU / 45)) * WIND.drift;
  birdX += (tx - birdX) * (1 - Math.exp(-dt / 0.6));

  stepAir(dt);

  cooldown -= dt;
  let n = null;
  for (const p of pipes) { if (p.x + PIPE_W > birdX - HW) { n = p; break; } }
  if (n && cooldown <= 0 && wantFlap(n)) {
    bird.vy = -FLAP;
    cooldown = COOLD;
    wingHold = 0.16;
    frameIdx = 0; frameT = 0;
  }

  frameT += dt;
  const rate = cooldown > 0 ? 0.13 : 0.09;
  if (frameT > rate) {
    frameT = 0;
    if (wingHold > 0) wingHold -= rate; else frameIdx = (frameIdx + 1) % 4;
  }

  bird.vy = Math.min(bird.vy + (GRAVITY + aBird + turb) * dt, MAXVY);
  bird.y += bird.vy * dt;

  for (const p of pipes) {
    p.x -= gspd * dt;
    if (!p.passed && p.x + PIPE_W < birdX - HW) { p.passed = true; score++; if (score > best) best = score; }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -80);

  if (bird.y + HH >= SKY || bird.y - HH <= 0) { die(); return; }
  for (const p of pipes) {
    if (birdX + HW > p.x && birdX - HW < p.x + PIPE_W &&
        (bird.y - HH < p.top || bird.y + HH > p.bot)) { die(); return; }
  }
}

function birdRot() { return bird.vy < -60 ? -0.26 : Math.min(0.80, bird.vy / 620); }

function die() {
  dead = true; deadT = 0; flash = 1;
  deathRot = birdRot();
  bird.vy = 0;
  spawnFeathers(birdX, bird.y);
}

const FEATHER_COLS = [C.birdY, C.birdY, C.birdD, C.birdC, "#ffffff"];
function spawnFeathers(x, y) {
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 70 + Math.random() * 230;
    feathers.push({
      x: x + (Math.random() * 2 - 1) * 8,
      y: y + (Math.random() * 2 - 1) * 6,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 90,           // bias upward so they puff out, then drift down
      rot: Math.random() * Math.PI,
      vr: (Math.random() * 2 - 1) * 9,
      ph: Math.random() * Math.PI * 2,
      fr: 4 + Math.random() * 4,
      len: Math.random() < 0.35 ? 6 : 4,
      col: FEATHER_COLS[(Math.random() * FEATHER_COLS.length) | 0]
    });
  }
}

function stepFeathers(dt) {
  if (!feathers.length) return;
  const drag = Math.exp(-3.2 * dt);
  for (const f of feathers) {
    f.vx *= drag;
    f.vy = Math.min(f.vy * drag + 420 * dt, 55);   // light: low terminal velocity
    f.ph += f.fr * dt;
    windAt(f.x, f.y);                               // carried by the wind
    f.x += (f.vx + Math.sin(f.ph) * 28 + (WA.u - gspd) * 0.9) * dt;   // + side-to-side flutter
    f.y += (f.vy + WA.a * 0.15) * dt;
    f.rot += (f.vr + Math.cos(f.ph) * 3) * dt;
  }
  feathers = feathers.filter(f => f.y < H + 10 && f.x > -20 && f.x < W + 20);
}

function makeBolts() {
  const out = [];
  const n = 3 + ((Math.random() * 3) | 0);
  for (let b = 0; b < n; b++) {
    let a = Math.random() * Math.PI * 2;
    let x = birdX + Math.cos(a) * 8, y = bird.y + Math.sin(a) * 6;
    const pts = [[Math.round(x), Math.round(y)]];
    const segs = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < segs; i++) {
      a += (Math.random() * 2 - 1) * 0.9;
      const l = 6 + Math.random() * 8;
      x += Math.cos(a) * l; y += Math.sin(a) * l;
      pts.push([Math.round(x), Math.round(y)]);
    }
    out.push(pts);
  }
  return out;
}

function stepDeath(dt) {
  deadT += dt;
  if (deadT < D_FREEZE) return;                 // frozen in place
  if (deadT < D_ZAP) {                          // electrocution
    zapT -= dt;
    if (zapT <= 0) {
      zapT = 0.045 + Math.random() * 0.03;
      zapOn = !zapOn;
      bolts = makeBolts();
      jit = [Math.round((Math.random() * 2 - 1) * 2), Math.round((Math.random() * 2 - 1) * 2)];
      if (Math.random() < 0.35) flash = Math.max(flash, 0.45);
    }
    return;
  }
  if (!falling) {                               // flip and drop
    falling = true; bolts = []; zapOn = false; jit = [0, 0];
    bird.vy = -D_HOP;
  }
  bird.vy = Math.min(bird.vy + GRAVITY * dt, 900);
  bird.y += bird.vy * dt;
  if (bird.y - SPR_H > H) { offT += dt; if (offT > D_REST) reset(); }
}

/* ============================================================
   AIR - wind model and the particles that show it
   ============================================================ */
function randIn(r) { return r[0] + Math.random() * (r[1] - r[0]); }
function sgn() { return Math.random() < 0.5 ? -1 : 1; }

function stepWind(dt) {
  wind.next -= dt;
  if (wind.next <= 0) {                         // new prevailing target, biased small
    wind.next = randIn(WIND.baseEvery);
    wind.target = sgn() * WIND.baseMax * Math.pow(Math.random(), 1.6);
  }
  wind.u += (wind.target - wind.u) * (1 - Math.exp(-dt / WIND.baseTau));
  if (Math.random() < WIND.gustRate * dt) {
    const g = { t: 0, dur: randIn(WIND.gustDur), amp: sgn() * WIND.gustAmp * (0.6 + 0.4 * Math.random()) };
    gusts.push(g);
    gustFront(g);
  }
  let gu = 0; gustE = 0;
  for (const g of gusts) {
    g.t += dt;
    const e = Math.sin(Math.PI * Math.min(1, g.t / g.dur)) ** 2;   // smooth rise and fall
    gu += g.amp * e; gustE = Math.max(gustE, e);
  }
  gusts = gusts.filter(g => g.t < g.dur);
  airU = (wind.u + gu) * windMul;
}

function spawnCurrent() {
  const up = Math.random() < WIND.upFrac, w = randIn(WIND.curW);
  currents.push({ x: W + w / 2 + 10, w: w, s: up ? -randIn(WIND.upS) : randIn(WIND.downS), ph: Math.random() * 97 });
}
function currentF(c, x) {                       // cosine column profile, 1 at the centre
  const d = Math.abs(x - c.x) / (c.w / 2);
  return d >= 1 ? 0 : 0.5 + 0.5 * Math.cos(Math.PI * d);
}
function windAt(x, y) {
  let a = 0;
  for (const c of currents) a += c.s * currentF(c, x);
  WA.u = airU; WA.a = a * windMul;
  return WA;
}

/* ---- particles: leaves, dust, speed streaks, swirls ---- */
function addPart(p) { if (airParts.length < AIR_MAX) airParts.push(p); }
function spawnLeaf(x, y, vy) {
  addPart({ k: 0, x: x, y: y, vx: airU - gspd, vy: vy, age: 0, life: 14,
            pose: (Math.random() * 4) | 0, poseT: 0, ph: Math.random() * 6.3,
            lph: Math.random() * 6.3, lw: sgn() * (3 + Math.random() * 3),   // own looping path
            col: LEAF_COLS[(Math.random() * LEAF_COLS.length) | 0], near: Math.random() < 0.2 });
}
function spawnSwirl(x, y, dir) {
  addPart({ k: 3, x: x, y: y, age: 0, life: 0.8 + Math.random() * 0.5, r: 4 + Math.random() * 4,
            dir: dir, ph: Math.random() * 6.3 });
}
function spawnDust(x, y, vy) {
  addPart({ k: 1, x: x, y: y, vx: airU - gspd, vy: vy, age: 0, life: 0.9 + Math.random() * 1.4,
            col: DUST_COLS[(Math.random() * DUST_COLS.length) | 0], big: Math.random() < 0.35 });
}
/* a whirlwind: an invisible-ish vortex that drags nearby leaves and dust round in circles */
function spawnWhirl(x, y, withDebris) {
  const w = { k: 3, whirl: true, x: x, y: y, age: 0, life: 2.2 + Math.random() * 1.6,
              r: 14 + Math.random() * 10, dir: sgn(), ph: Math.random() * 6.3,
              str: 70 + Math.random() * 40 };
  addPart(w);
  if (!withDebris) return;
  const nl = 5 + ((Math.random() * 5) | 0), nd = 10 + ((Math.random() * 8) | 0);
  for (let i = 0; i < nl + nd; i++) {
    const a = Math.random() * 6.3, d = w.r * (0.3 + Math.random() * 0.9);
    if (i < nl) spawnLeaf(x + Math.cos(a) * d, y + Math.sin(a) * d, 0);
    else spawnDust(x + Math.cos(a) * d, y + Math.sin(a) * d, 0);
  }
}
function gustFront(g) {                         // a gust arrives: leaves torn off the bushes, a whirlwind
  const n = 4 + ((Math.random() * 4) | 0);
  for (let i = 0; i < n; i++) spawnLeaf(Math.random() * W, SKY - 16 - Math.random() * 6, -50 - Math.random() * 50);
  spawnWhirl(W * (0.2 + Math.random() * 0.7), 70 + Math.random() * (SKY - 150), true);
  for (let i = 0; i < 2; i++) spawnSwirl(Math.random() * W, 60 + Math.random() * (SKY - 120), sgn());
}
function spawnAir(dt) {
  if (windMul <= 0) return;
  const S = Math.min(1.5, Math.abs(airU) / 45);
  const flow = airU - gspd;                     // screen-space air velocity
  const edgeX = flow < 0 ? W + 6 : -6;
  const chance = r => Math.random() < r * dt;
  if (chance(1.5 + 9 * S)) spawnLeaf(edgeX, 30 + Math.random() * (SKY - 70), 0);
  if (Math.abs(airU) > 10 && chance(10 * S))
    addPart({ k: 2, x: Math.random() * W, y: 16 + Math.random() * (SKY - 60), age: 0,
              life: 0.35 + Math.random() * 0.4, len: 8 + 14 * Math.min(1, S) });
  if (chance((Math.abs(airU) > 8 ? 30 * S : 0) + 14 * gustE * windMul))       // kicked off the ground
    spawnDust(Math.random() * W, SKY - 2 - Math.random() * 26, -(5 + Math.random() * 15));
  if (chance(12 * S)) spawnDust(edgeX, 20 + Math.random() * (SKY - 50), 0);      // blowing across the sky
  if (chance(0.25 * windMul * (0.3 + S))) spawnWhirl(edgeX, 60 + Math.random() * (SKY - 130), Math.random() < 0.5);
  for (const c of currents) {                   // columns show themselves by what they carry
    const cx = () => c.x + (Math.random() - 0.5) * c.w * 0.8;
    if (chance(3 * windMul)) spawnDust(cx(), 30 + Math.random() * (SKY - 50), 0);
    if (chance(0.8 * windMul)) spawnLeaf(cx(), c.s < 0 ? SKY - 20 - Math.random() * 40 : 30 + Math.random() * 60, 0);
  }
  for (const c of currents)                     // eddies shed at column edges
    if (chance(0.6 * windMul)) spawnSwirl(c.x + sgn() * c.w / 2, 40 + Math.random() * (SKY - 90), c.s < 0 ? -1 : 1);
  if (Math.abs(airU) > 18 && !dead)             // and in the lee of each pipe lip
    for (const p of pipes) if (chance(0.5)) {
      const lx = airU < 0 ? p.x - CAP_X - 6 : p.x + PIPE_W + CAP_X + 6;
      const ly = Math.random() < 0.5 ? p.top - CAP_H / 2 : p.bot + CAP_H / 2;
      spawnSwirl(lx, ly, airU < 0 ? 1 : -1);
    }
}
function stepAir(dt) {
  spawnAir(dt);
  if (!airParts.length) return;
  const S = Math.min(1, Math.abs(airU) / 45);
  const whirls = airParts.filter(p => p.whirl);
  for (const p of airParts) {
    p.age += dt;
    windAt(p.x, p.y);
    const flow = WA.u - gspd, vAir = WA.a * 0.4;      // rising air carries things up
    if (p.k < 2) for (const w of whirls) {            // caught in a whirlwind: orbit it
      const dx = p.x - w.x, dy = p.y - w.y, R = w.r * 1.8;
      const d = Math.hypot(dx, dy);
      if (d < 1 || d > R) continue;
      const e = Math.sin(Math.PI * Math.min(1, w.age / w.life));   // spins up, spins down
      const t = w.str * e * (1 - 0.5 * d / R) * dt;
      p.x += (-dy / d * w.dir - dx / d * 0.25) * t;
      p.y += ( dx / d * w.dir - dy / d * 0.25) * t * 0.8;
    }
    if (p.k === 0) {                                  // leaf: inertia, flutter, tumble
      p.vx += (flow - p.vx) * (1 - Math.exp(-2.5 * dt));
      p.vy += (22 + vAir - p.vy) * (1 - Math.exp(-2 * dt));
      p.ph += 5 * dt; p.lph += p.lw * (0.6 + S) * dt;
      const loop = (6 + 26 * S) * Math.min(2, Math.max(1, windMul) ** 0.5);   // loop-de-loops grow with the wind
      p.x += (p.vx + Math.sin(p.ph) * 12 + Math.cos(p.lph) * loop) * dt;
      p.y += (p.vy + Math.sin(p.lph) * loop * 0.8) * dt;
      p.poseT -= dt;
      if (p.poseT <= 0) { p.poseT = 0.28 - 0.18 * S; p.pose = (p.pose + 1) % LEAF_POSES.length; }
      if (p.y > SKY - 3) { p.y = SKY - 3; p.vy = 0; p.life = Math.min(p.life, p.age + 0.6); }
    } else if (p.k === 1) {                           // dust: light, follows the air closely
      p.vx += (flow - p.vx) * (1 - Math.exp(-6 * dt));
      p.x += p.vx * dt; p.y += (p.vy + vAir) * dt;
    } else if (p.k === 2) {                           // streak: exactly the air
      p.x += flow * dt;
    } else {                                          // swirl / whirlwind: drifts with the air
      p.x += flow * (p.whirl ? 0.85 : 1) * dt; p.y += vAir * 0.5 * dt;
    }
  }
  airParts = airParts.filter(p => p.age < p.life && p.x > -24 && p.x < W + 24 && p.y > -12 && p.y < SKY + 4);
}

/* ---------- bird sprite: 17x12 authored, 34x24 rendered ---------- */
const FRAMES = [
  "......................KKKKKKK........KKYYYYYWWK......KYYDYYYWWWK......KDDDDYYWWWKK....KDDDDDDYCCWWRRK..KDDDDDDCCCCRRRK..KDDDDDCCCCCRRK....KYYYCCCCCCOOK....KKYYYCCCCKKK.......KKKKKKK.......................",
  "......................KKKKKKK........KKYYYYYWWK......KYYYYYYYWWWK.....KYYYYYYYWWWKK...KDDDDDDYCCWWRRK..KDDDDDDCCCCRRRK..KDDDDDDCCCCCRRK..KDDDDDCCCCCCOOK...KYYYCCCCCKKKK......KKKKKKK.......................",
  "......................KKKKKKK........KKYYYYYWWWK.....KYYYYYYYWWWKK...KYYYYYYYCCWWRRK..KDDDDDDDCCCRRRK..KDDDDDDCCCCCCRK..KDDDDCCCCCCCOOK...KDDDCCCCCKKKK.....KKKKKKK.......................",
  "......................KKKKKKK........KKYYYYYWWK......KYYYYYYYWWWK.....KYYYYYYYWWWKK...KDDDDDDYCCWWRRK..KDDDDDDCCCCRRRK..KDDDDDDCCCCCRRK..KDDDDDCCCCCCOOK...KYYYCCCCCKKKK......KKKKKKK......................."
];
const SPR = { K: C.ink, Y: C.birdY, D: C.birdD, C: C.birdC, W: C.eye, R: C.beak, O: C.beakLo };
/* electrocuted "x-ray" palette: glowing outline, dark body */
const SPR_ZAP = { K: "#fffbe0", Y: "#2a2f7a", D: "#151845", C: "#3a4290", W: "#ffffff", R: "#7f8cff", O: "#4a55c0" };


/* ---------- paint ---------- */
const cvs = document.getElementById("game");
const vctx = cvs.getContext("2d", { alpha: false });   // what the viewer sees
const buf = document.createElement("canvas");             // the scene is painted here
const ctx = buf.getContext("2d", { alpha: false });
const stage = document.getElementById("stage");
let R = 2, DS = 2;   // R = buffer pixels per logical px (integer), DS = device px per logical px

/* CANVAS TYPE - the face is 1050 units/em, so 14px maps em to 21 device units
   and the 825-unit ink box to 16.5: only multiples of 14 (14 here, 28 for the
   score and CRASHED) put every stem and every 16px advance on whole pixels
   instead of resampling them. The face has ONE weight, so no fake-bold. */
const FAM = '"04b_19", ui-monospace, monospace';
const F = { hud: '14px ' + FAM, big: '28px ' + FAM };

/* Kick the embedded face so frame 1 already uses it instead of the fallback
   stack; the data URI is inline, so this resolves without a network request. */
if (document.fonts && document.fonts.load) {
  Promise.all(["14px", "28px"].map(s => document.fonts.load(s + ' "04b_19"'))).catch(() => {});
}

/* Centring is done by hand: measureText returns the advance sum, the left edge
   is rounded, and glyphs then land on whole pixels rather than half of one. */
function txt(s, x, y, col, font, align) {
  ctx.font = font;
  const w = ctx.measureText(s).width;
  const x0 = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = col;
  ctx.fillText(s, Math.round(x0), Math.round(y));
}


function fit() {
  // The stage is whatever space CSS leaves between the gutters and the caption,
  // so this works the same on phones, in iframes and with the address bar moving.
  const box = stage.getBoundingClientRect();
  if (box.width < 1 || box.height < 1) return;
  const dpr = devicePixelRatio || 1;
  DS = Math.min(box.width / W, box.height / H) * dpr;
  const devW = Math.max(1, Math.floor(W * DS)), devH = Math.max(1, Math.floor(H * DS));
  DS = Math.min(devW / W, devH / H);
  if (cvs.width !== devW || cvs.height !== devH) {
    // display canvas = exact device pixels, so the scanlines land on real rows
    cvs.width = devW; cvs.height = devH;
    cvs.style.width = (devW / dpr) + "px";
    cvs.style.height = (devH / dpr) + "px";
  }
  // scene buffer = largest whole multiple of the grid not above the device size;
  // it is then stretched (nearest-neighbour) by a factor in [1, 2)
  const r = Math.max(1, Math.floor(DS));
  if (r !== R || buf.width !== W * r) { R = r; buf.width = W * R; buf.height = H * R; }
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.imageSmoothingEnabled = false;
  vctx.imageSmoothingEnabled = false;
}
fit();
addEventListener("resize", fit);
addEventListener("orientationchange", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);   // caption reflow, toolbars, iframes
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

function px(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function sky() {
  const cols = [C.skyA, C.skyA, C.skyB, C.skyB, C.skyC, C.skyC, C.skyD];
  const bh = Math.ceil(SKY / cols.length);
  for (let i = 0; i < cols.length; i++) px(0, i * bh, W, bh, cols[i]);
}

function clouds() {
  ctx.fillStyle = C.cloud;
  for (let i = 0; i < 3; i++) {
    const x = Math.round((((i * 118) - cloudX) % (W + 120) + W + 120) % (W + 120) - 60);
    const y = 46 + i * 58;
    ctx.fillRect(x, y, 44, 10);
    ctx.fillRect(x + 8, y - 6, 28, 6);
    ctx.fillRect(x + 16, y - 11, 14, 5);
    ctx.fillRect(x - 6, y + 10, 56, 6);
  }
}

function skyline() {
  ctx.fillStyle = C.hillDark;
  for (let i = 0; i < 8; i++) {
    const x = Math.round((((i * 46) - dist * 0.06) % (W + 70) + W + 70) % (W + 70) - 35);
    ctx.fillRect(x, SKY - 26, 34, 26);
  }
  ctx.fillStyle = C.hill;
  for (let i = 0; i < 9; i++) {
    const x = Math.round((((i * 40) - dist * 0.14) % (W + 60) + W + 60) % (W + 60) - 30);
    ctx.fillRect(x, SKY - 14, 30, 14);
    ctx.fillRect(x + 4, SKY - 18, 22, 4);
  }
}

/* isTop is passed in, never inferred: inferring it from position mis-caps
   long lower pipes, which is the bug reported earlier in this build. */
function pipePart(x, y0, y1, isTop) {
  const lipY = isTop ? y1 - CAP_H : y0;
  const shaftY0 = isTop ? y0 : y0 + CAP_H;
  const shaftY1 = isTop ? y1 - CAP_H : y1;

  for (const [ox, bw, col] of SHAFT_BANDS) px(x + ox - CAP_X, shaftY0, bw, shaftY1 - shaftY0, col);
  for (const [ox, bw, col] of LIP_BANDS)   px(x + ox - CAP_X, lipY, bw, CAP_H, col);

  // cap edges: dark rule top and bottom of the lip, and a rule at the join
  px(x - CAP_X, lipY, CAP_W, 2, C.pipeO);
  px(x - CAP_X, lipY + CAP_H - 2, CAP_W, 2, C.pipeO);
}

function ground() {
  const off = Math.round(dist % 24);
  // grass tufts lean with the wind: 1 px, 2 px when it is strong
  const au = Math.abs(airU);
  const lean = Math.sign(airU) * ((au > 8 ? 1 : 0) + (au > 30 ? 1 : 0));
  px(0, SKY, W, GROUND, C.sand);
  px(0, SKY, W, 12, C.grass);
  px(0, SKY + 12, W, 3, C.grassDark);
  for (let x = -24; x < W + 24; x += 24) {
    px(x - off, SKY + 30, 12, GROUND - 30, C.sandDark);
    px(x - off + 14, SKY + 19, 6, 4, C.grassDark);
    px(x - off + 14 + lean, SKY + 15, 6, 4, C.grassDark);
  }
}

function drawStreaksSwirls() {
  for (const p of airParts) {
    if (p.k < 2) continue;
    let e = Math.sin(Math.PI * Math.min(1, p.age / p.life));      // fade in and out
    if (p.k === 2) {
      ctx.globalAlpha = 0.75 * e;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.len), 1);
      ctx.globalAlpha = 0.35 * e;                                  // fainter tail, one row down
      ctx.fillRect(Math.round(p.x + p.len * 0.3), Math.round(p.y) + 1, Math.round(p.len * 0.6), 1);
    } else {
      const n = p.whirl ? 10 : 7, r = p.r * (1 - 0.45 * p.age / p.life) * (p.whirl ? 0.8 : 1);
      if (p.whirl) e *= 0.45;
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < n; i++) {                                // head first, tail curls inward
        const ang = p.ph + p.dir * (p.age * 7 - i * 0.55);
        const rr = r * (1 - 0.07 * i);
        ctx.globalAlpha = 0.9 * e * (1 - 0.8 * i / n);
        const s = i < 3 ? 2 : 1;
        ctx.fillRect(Math.round(p.x + Math.cos(ang) * rr), Math.round(p.y + Math.sin(ang) * rr * 0.8), s, s);
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawDustLeaves(nearLayer) {
  for (const p of airParts) {
    if (p.k === 1 && !nearLayer) {
      const e = Math.sin(Math.PI * Math.min(1, p.age / p.life));
      ctx.globalAlpha = e;
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.big ? 2 : 1, 1);
    } else if (p.k === 0 && p.near === nearLayer) {
      const pose = LEAF_POSES[p.pose], x0 = Math.round(p.x) - 3, y0 = Math.round(p.y) - 2;
      ctx.globalAlpha = Math.min(1, (p.life - p.age) / 0.4);      // fade once landed
      for (let ry = 0; ry < 2; ry++) for (let rx = 0; rx < 3; rx++) {
        const ch = pose[ry][rx];
        if (ch === ".") continue;
        ctx.fillStyle = ch === "B" ? p.col[0] : p.col[1];
        ctx.fillRect(x0 + rx * 2, y0 + ry * 2, 2, 2);
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* WIND << 18 under SPD/GAP, with a pixel arrow while the bird is in a current */
function drawWindHud() {
  const mag = Math.round(Math.abs(airU));
  const s = windMul <= 0 ? "WIND OFF" : mag < 3 ? "WIND CALM" : "WIND " + (airU < 0 ? "<< " : ">> ") + mag;
  txt(s, W - 8, 34, "rgba(255,255,255,.9)", F.hud, "right");
  if (Math.abs(aBird) < 25) return;
  ctx.font = F.hud;
  const x = Math.round(W - 8 - ctx.measureText(s).width - 14), y = 23;
  const up = aBird < 0;
  const head = [[3,1],[2,3],[1,5],[0,7]], stem = [[2,3],[2,3],[2,3],[2,3],[2,3],[2,3]];
  const rows = up ? head.concat(stem) : stem.concat(head.slice().reverse());
  ctx.fillStyle = C.ink;                                           // 1 px outline
  rows.forEach(([o, w], i) => ctx.fillRect(x + o - 1, y + i - 1, w + 2, 3));
  ctx.fillStyle = up ? "#bff7a0" : "#ffb38a";
  rows.forEach(([o, w], i) => ctx.fillRect(x + o, y + i, w, 1));
}

function drawBird() {
  const f = FRAMES[frameIdx] || FRAMES[0];
  const pal = dead && zapOn ? SPR_ZAP : SPR;
  ctx.save();
  if (!dead) {
    ctx.translate(Math.round(birdX), Math.round(bird.y));
    ctx.rotate(birdRot());
  } else if (!falling) {
    ctx.translate(Math.round(birdX) + jit[0], Math.round(bird.y) + jit[1]);
    ctx.rotate(deathRot);
  } else {
    ctx.translate(Math.round(birdX), Math.round(bird.y));
    ctx.scale(1, -1);                            // belly up
    ctx.rotate(Math.min(0.5, (deadT - D_ZAP) * 0.6));
  }
  for (let y = 0; y < BH; y++) {
    for (let x = 0; x < BW; x++) {
      const col = pal[f.charAt(y * BW + x)];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect((x * BS) - (SPR_W >> 1), (y * BS) - (SPR_H >> 1), BS, BS);
    }
  }
  ctx.restore();
}

function drawFeathers() {
  for (const f of feathers) {
    ctx.save();
    ctx.translate(Math.round(f.x), Math.round(f.y));
    ctx.rotate(f.rot);
    ctx.fillStyle = C.ink;
    ctx.fillRect(-(f.len >> 1) - 1, -2, f.len + 2, 4);
    ctx.fillStyle = f.col;
    ctx.fillRect(-(f.len >> 1), -1, f.len, 2);
    ctx.fillStyle = C.birdD;
    ctx.fillRect(-(f.len >> 1), 0, 1, 1);        // quill
    ctx.restore();
  }
}

function boltLine(x0, y0, x1, y1, s, col) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  ctx.fillStyle = col;
  for (let i = 0; i <= n; i++) {
    const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
    ctx.fillRect(x - (s >> 1), y - (s >> 1), s, s);
  }
}

function drawBolts() {
  for (const pts of bolts) {
    for (let i = 1; i < pts.length; i++) boltLine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1], 3, "#5fd8ff");
  }
  for (const pts of bolts) {
    for (let i = 1; i < pts.length; i++) boltLine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1], 1, "#ffffff");
  }
}

function outlineText(s, x, y, col, font) {
  ctx.font = font;
  const w = ctx.measureText(s).width;
  const x0 = Math.round(x - w / 2), y0 = Math.round(y);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.ink;
  for (const d of [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,1]]) ctx.fillText(s, x0 + d[0], y0 + d[1]);
  ctx.fillStyle = col;
  ctx.fillText(s, x0, y0);
}

function draw() {
  sky();
  clouds();
  skyline();
  drawStreaksSwirls();
  for (const p of pipes) {
    pipePart(p.x, 0, p.top, true);
    pipePart(p.x, p.bot, SKY, false);
  }
  ground();
  drawDustLeaves(false);
  if (dead && zapOn && !falling) {               // electric glow behind the bird
    ctx.fillStyle = "rgba(127,232,255,.28)";
    ctx.fillRect(birdX - SPR_W / 2 - 6, bird.y - SPR_H / 2 - 6, SPR_W + 12, SPR_H + 12);
  }
  drawBird();
  drawDustLeaves(true);                          // the near leaves pass in front of the bird
  drawBolts();
  drawFeathers();

  outlineText(String(score), W / 2, 78, "#ffffff", F.big);
  txt("BEST " + best, 8, 16, "rgba(255,255,255,.9)", F.hud, "left");
  txt("SPD " + Math.round(speed) + " GAP " + Math.round(gap), W - 8, 16,
      "rgba(255,255,255,.9)", F.hud, "right");
  drawWindHud();

  const k = 1 - Math.exp(-score / TAU);
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillRect(8, 22, 96, 5);
  ctx.fillStyle = C.birdY;
  ctx.fillRect(8, 22, 96 * k, 5);
  if (cooldown > 0 && !dead) {
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillRect(8, 30, 96 * (cooldown / COOLD), 2);
    txt("WING COOLDOWN", 8, 48, "rgba(255,255,255,.75)", F.hud, "left");
  }

  if (dead) {
    ctx.fillStyle = "rgba(255,255,255," + (0.5 * flash) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (dead && offT > 0) {
    ctx.fillStyle = "rgba(20,32,15,.92)";
    ctx.fillRect(W / 2 - 76, H / 2 - 40, 152, 80);
    txt("CRASHED", W / 2, H / 2 - 12, "#ffffff", F.big, "center");
    txt("score " + score, W / 2, H / 2 + 8, "#9fb0bd", F.hud, "center");
    txt("restarting...", W / 2, H / 2 + 26, "#9fb0bd", F.hud, "center");
  }

  /* blit the scene to the display canvas, then draw scanlines in DEVICE
     pixels at an integer period (~1.5 logical px) so the spacing is exact. */
  vctx.drawImage(buf, 0, 0, cvs.width, cvs.height);
  const O = Math.max(3, Math.round(1.5 * DS));
  vctx.fillStyle = "rgba(0,0,0,.15)";
  for (let y = 0; y < cvs.height; y += O) vctx.fillRect(0, y, cvs.width, 1);
}

if (windMul !== 1) document.getElementById("windnote").textContent = windMul === 0 ? " (wind off)" : " (wind x" + windMul + ")";
reset();
let acc = 0, last = performance.now();
function loop(now) {
  acc = Math.min(0.25, acc + (now - last) / 1000);
  last = now;
  while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
