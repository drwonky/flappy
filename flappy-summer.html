<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="windctl"><label for="wind">sun</label><input type="range" id="wind" min="0" max="1000" step="1" value="435"
  aria-valuetext="x1"><output id="windval" for="wind">x1</output></div>
<div id="hud">summer r5</div>

<script>
"use strict";

/* ============================================================
   GEOMETRY - 288x512 logical, base 288x112 -> sky 400. SKY is
   nudged to 399 so the horizon lands on a scan row.
   ============================================================ */
const W = 288, H = 512, GROUND = 113;
const SKY = H - GROUND;

/* PHYSICS - per-frame values widely quoted for the original (gravity
   0.5 px/frame^2, flap -9 px/frame) converted to px/s. Unchanged from
   the previous build; NOT re-simulated in this edit (sandbox down). */
const GRAVITY = 1800;
const FLAP = 540;
const MAXVY = 560;
const FIXED = 1/120;
const COOLD = 0.34;         // > FLAP/GRAVITY = 0.30s, so the bird cannot hover

const BIRD_X = 80;
const BW = 17, BH = 12;     // hand-authored sprite
const BS = 2;               // sprite is drawn 2x: 34x24 on screen
const SPR_W = BW * BS, SPR_H = BH * BS;
const HW = 10, HH = 8;      // hitbox 20x16, forgiving inside the sprite as the original's is

/* PIPE - shaft 52 (pipe.png is 52x320). Lip overhang and lip height are
   now ratios of the shaft, measured off the reference: lip = 1.24x shaft,
   lip height = 0.40x shaft. */
const PIPE_W = 52;
const CAP_X = 6;                    // lip overhang per side
const CAP_W = PIPE_W + 2 * CAP_X;   // 64
const CAP_H = 20;
const GAP0 = 140, GAP1 = 104;       // floor raised from 96: the bird is 16 tall now

const SPEED0 = 130, SPEED1 = 200;
const SPACE0 = 1.30, SPACE1 = 0.95;
const TAU = 85;

const K = 0.30;
const MARGIN_FRAC = 0.06;
const WOBBLE_FRAC = 0.12;

/* ============================================================
   AIR CURRENTS - every effect is capped so it NUDGES the bird, never
   decides a gate.
     u = horizontal air speed, px/s   (+ tailwind, - headwind)
     a = vertical accel on the bird, px/s^2   (- lift, + sink)
   Three layers: a slowly wandering prevailing wind, short gusts, and
   updraft / downdraft columns that belong to the world and scroll with it.
   ?wind=0 turns it all off (same RNG stream as the calm game), 1 is the
   default nudge, 2 is a stiff breeze. Above 2 it builds into a STORM: by
   ?wind=20 (and anything higher, ?wind=5000 included) it is a hurricane -
   the bird is shoved back and forth, buffeted, and slammed by up/downdrafts.
   ============================================================ */
const WIND = {
  baseMax: 28, baseEvery: [3, 7], baseTau: 1.5,     // prevailing wind
  gustRate: 0.15, gustAmp: 20, gustDur: [0.6, 1.8], // gusts
  curGap: [160, 380], curW: [70, 130],              // vertical currents
  upS: [110, 160], downS: [90, 130], upFrac: 0.55,
  aCap: 0.13 * GRAVITY,                             // lift / sink cap: 13% of gravity
  spdCap: 0.12, spdPerU: 0.12 / 45,                 // ground speed: at most +-12%
  drift: 5,                                         // bird x shift at full wind, px
  turb: 60                                          // turbulence wobble, px/s^2
};
/* The wind setting comes from ?wind= and the WIND slider; both can change it live.
   storm: 0 up to x2 (unchanged gentle wind), climbing on a log scale to 1
   (hurricane) at x20; everything above that is a full hurricane. */
let windMul = 1, storm = 0, airMul = 1, visMul = 1, physMul = 1;
function setWindMul(v) {
  windMul = v;
  storm = windMul <= 2 ? 0 : Math.min(1, Math.log(windMul / 2) / Math.log(10));
  airMul = windMul <= 2 ? windMul : 2 + 6 * storm;    // air speed / current strength, max x8
  visMul = Math.min(5, airMul);                       // particle spawn rates
  physMul = windMul <= 2 ? windMul : 2 + 2 * storm;   // the bird's caps, max x4
}
setWindMul((() => {
  try {
    const v = parseFloat(new URLSearchParams(location.search).get("wind"));
    return isFinite(v) && v >= 0 ? v : 1;
  } catch (e) { return 1; }
})());
/* ============================================================
   SUN - swings slowly across the sky. Light is parallel, (sunSX, -1) points at
   the sun, so every pipe casts a shadow away from it. The SUN slider (?sun=)
   sets how hard it bakes the bird; ?wind= still sets the wind.
   ============================================================ */
const SUN = { period: 110, swing: 0.55 };   // s per swing back and forth, max shadow lean (a high desert sun)
/* ============================================================
   HEAT - skin heat rises in sunlight and drains away in shade. Skin heat
   above `soakAt` soaks into the core, and the core never cools during a game.
   Every wingbeat is work and adds a little heat. Heat weakens the flap and
   makes the bird sluggish, so it must flap more often (more heat) until it
   can no longer hold its height.
   ============================================================ */
const HEAT = {
  rate: 0.080,        // skin heat per second in full sun at x1
  cool: 0.50,         // fraction of skin heat shed per second in full shade
  air: 0.06,          // ...and in the sun, by moving air
  soakAt: 0.10,       // skin heat above this soaks into the core
  soak: 0.10,         // per second, per unit of skin heat above soakAt
  flap: 0.004,        // skin heat per wingbeat
  lift: 0.45,         // cooked: flap is 45% weaker
  weight: 0.30,       // ...and the bird sinks 30% harder
  curve: 2.0          // effect = heat^curve: a warm bird barely notices
};
let sunMul = (() => {
  try {
    const v = parseFloat(new URLSearchParams(location.search).get("sun"));
    return isFinite(v) && v >= 0 ? v : 1;
  } catch (e) { return 1; }
})();
function sunK() { return sunMul <= 0 ? 0 : sunMul <= 1 ? sunMul : Math.pow(sunMul, 0.3); }   // x20 bakes ~2.5x as hard as x1
const STORM = { aCap: 0.36 * GRAVITY, buffet: 0.35 * GRAVITY, drift: 40, spd: 0.6, vAirMax: 260 };
const AIR_MAX = 420;                                // particle pool (the dust is thick)
const LEAF_COLS = [["#c08a45","#6e4220"], ["#a86a3a","#5a3a1c"], ["#d9a35a","#8a5a2e"],   // grit, dry brush,
                   ["#8a8a3a","#4e4e1e"], ["#4a3a32","#2a201c"]];                          // ash
const DUST_COLS = ["#e8b86a", "#f4d49a", "#c88c46", "#b07a50"];
/* leaf poses, 3x2 cells of 2x2 px: B body, D stem/edge. Cycling them tumbles the leaf. */
const LEAF_POSES = [["BB.", ".BD"], ["BBD", "..."], [".BB", "DB."], ["DBB", "..."]];

const C = {
  skyA:"#a8502a", skyB:"#c56a30", skyC:"#dc8c3c", skyD:"#eeb456",   // scorched, smoky sky
  cloud:"#8a5a44", hill:"#b0683a", hillDark:"#7e4628",               // smoke banks, mesas
  grass:"#c48a4a", grassDark:"#8e5a2c",                              // baked crust, dry tufts
  sand:"#e0a85c", sandDark:"#c88c46",
  dune:"#eebb6c", duneShade:"#cf9550", duneEdge:"#9a6630",          // drifted sand
  sun:"#fff3c2", sunGlow:"#ffd66e", shadow:"rgba(60,22,6,.30)",
  cactus:"#5f8a3a", cactusLt:"#86b450", cactusDk:"#3c5e22",
  pipeO:"#14200f", pipeLt:"#8ed04a", pipeHi:"#74bf2e", pipeMid:"#5aa81f", pipeLo:"#3d7a12",
  ink:"#1a2419",
  birdY:"#f8e018", birdD:"#d9a90f", birdC:"#f5f2c0",
  eye:"#ffffff", pupil:"#20242a", beak:"#e8483a", beakLo:"#b62f26"
};

/* ============================================================
   PIPE BANDS - the structure that reads as a Mario warp pipe.
   Both lists are x-offsets from the LEFT EDGE OF THE LIP, so the
   highlight column lands at the same absolute x in lip and shaft.
   The shaft's extra structure is absent: no dashes, no rivets.
   ============================================================ */
const SHAFT_BANDS = [   // drawn at x, width PIPE_W
  [CAP_X,      1, C.pipeO],    // outline
  [CAP_X + 1,  6, C.pipeLt],   // left catch-light
  [CAP_X + 7, 11, C.pipeHi],   // highlight
  [CAP_X + 18, 18, C.pipeMid], // body
  [CAP_X + 36, 15, C.pipeLo],  // shadow
  [CAP_X + 51,  1, C.pipeO]    // outline
];
const LIP_BANDS = [     // drawn at x - CAP_X, width CAP_W
  [0,  1, C.pipeO],
  [1,  12, C.pipeLt],   // left bands match the shaft exactly
  [13, 11, C.pipeHi],
  [24, 18, C.pipeMid],
  [42, 20, C.pipeLo],   // the overhang lands in the shadow - that IS the turn
  [62,  1, C.pipeO],
  [63,  1, C.pipeO]
];

let bird, pipes, score = 0, best = 0, cooldown = 0, since = 1e9, aimOff = 0;
let dead = false, deadT = 0, flash = 0, clock = 0;
let frameIdx = 0, frameT = 0, wingHold = 0;
let speed = SPEED0, gap = GAP0, spaceSec = SPACE0;

/* ---------- death sequence ----------
   0 .. D_FREEZE        : world and bird frozen, feathers burst out
   D_FREEZE .. D_ZAP    : electrocution - palette flicker, jitter, bolts, flashes
   D_ZAP ..             : bird flips upside down, small hop, falls off screen */
const D_FREEZE = 0.22, D_ZAP = 1.15, D_HOP = 240, D_REST = 0.8;
let feathers = [], bolts = [], zapT = 0, zapOn = false, jit = [0, 0];
let falling = false, offT = 0, deathRot = 0;

/* air state */
let wind = { u: 0, target: 0, next: 0 }, gusts = [], currents = [], airParts = [];
let airU = 0, gustE = 0, aBird = 0, aFelt = 0, airClock = 0;
let birdX = BIRD_X, gspd = SPEED0, dist = 0, cloudX = 0, curSince = 0, curNext = 300;
const WA = { u: 0, a: 0 };                          // windAt() result, reused

/* summer state: the sun, smoke and dust carry on between games, the heat does not */
let sunPh = Math.random() * 6.283, sunSX = 0;
let smoke = [], cacti = [];
/* SAND - one depth for the whole world (px), like the winter snow. Blown sand builds
   up on the ground, banks against the pipes and heaps on every bottom lip; it keeps
   building between games and is saved in the browser. When a heap closes a gap
   (less than `block` px left to fly through) the wind scours it all back to `start`
   and the cycle begins again. Faster in a dust storm. ?sand=N sets the depth. */
const SAND = { start: 2, max: 400, rate: 0.15, pipeK: 1.0, ledgeMax: 3, block: 24, clear: 2.5 };
const SAND_KEY = "flappy-summer-sand", SAND_COLS = 34;   // a lip heap is 34 two-px columns
let sandD = (() => {
  const ok = v => isFinite(v) && v >= 0;
  try { const q = parseFloat(new URLSearchParams(location.search).get("sand")); if (ok(q)) return Math.min(q, SAND.max); } catch (e) {}
  try { const v = parseFloat(localStorage.getItem(SAND_KEY)); if (ok(v)) return Math.min(v, SAND.max); } catch (e) {}
  return SAND.start;
})();
let clearT = 0, clearFrom = 0, clears = 0, saveT = 0;
let trail = [];                                       // smoke pouring off a hot bird
const dustW = { k: 1, target: 1, next: 0 }, smokeW = { k: 1, target: 1, next: 0 };
let skin = 0, core = 0, shade = 0, flapEff = FLAP, gEff = GRAVITY, flaps = 0;
let sweat = [], shadeK = 0;                          // sweat drops, eased shade
/* A pipe's shadow can lie up to SUN.swing * SKY px to either side of it, so pipes
   are born that far beyond the right edge and kept that far past the left one:
   their shade scrolls on and off with them instead of popping in and out. */
const REACH = Math.ceil(SUN.swing * SKY) + CAP_X + 4;


function ramp(sc) {
  const k = 1 - Math.exp(-sc / TAU);
  speed = SPEED0 + (SPEED1 - SPEED0) * k;
  gap = GAP0 + (GAP1 - GAP0) * k;
  spaceSec = SPACE0 + (SPACE1 - SPACE0) * k;
}
const usable = () => gap - 2 * HH;

function reset() {
  bird = { y: H * 0.42, vy: 0 };
  pipes = [];
  score = 0; cooldown = 0; since = 1e9; aimOff = 0;
  dead = false; deadT = 0; flash = 0;
  frameIdx = 0; frameT = 0; wingHold = 0;
  feathers = []; bolts = []; zapT = 0; zapOn = false; jit = [0, 0];
  falling = false; offT = 0; deathRot = 0;
  wind = { u: 0, target: 0, next: 0 }; gusts = []; currents = []; airParts = [];
  airU = 0; gustE = 0; aBird = 0; aFelt = 0; birdX = BIRD_X; curSince = 0; curNext = 300;
  skin = 0; core = 0; shade = 0; shadeK = 0; flaps = 0; sweat = []; trail = []; heatFx();
  ramp(0); gspd = speed;
  firstPipes();
}

function spawn(x = W + REACH) {
  const top = 30 + Math.random() * (SKY - 60 - gap);
  pipes.push({ x: x, top: top, bot: top + gap, passed: false,
               sf: 0.85 + Math.random() * 0.3,          // this pipe's share of the sand
               cut: new Float32Array(SAND_COLS) });      // where the bird has plowed through its heap
  aimOff = (Math.random() * 2 - 1) * usable() * WOBBLE_FRAC;
  spawnCactus(x + PIPE_W / 2 + speed * spaceSec / 2);     // half way to the next pipe
}
function firstPipes() {           // a new game: the first pipe at the right edge, as always,
  let x = W;                      // and the ones behind it already out there in the glare
  for (; x <= W + REACH; x += speed * spaceSec) spawn(x);
  since = W + REACH - (x - speed * spaceSec);
}

function wantFlap(n) {
  // aim a touch higher in sinking air, a touch lower in rising air. (No need to steer
  // for shade: the apex rule below keeps the bird in the upper part of every gap,
  // which is the side the top pipe shades - tested, aiming for shade changed nothing.)
  const target = (n.top + n.bot) / 2 + aimOff - aFelt * 0.02;
  // a hot bird falls harder and climbs less per flap: look further ahead
  if ((bird.y - target) + K * (gEff / GRAVITY) * (FLAP / flapEff) * bird.vy <= 0) return false;
  // the flap's apex under the gravity the bird actually feels right now
  const apex = bird.y - (flapEff * flapEff) / (2 * Math.max(GRAVITY * 0.3, gEff + aFelt));
  return apex >= n.top + HH + usable() * MARGIN_FRAC;
}

function step(dt) {
  flash = Math.max(0, flash - dt * 3);
  airClock += dt;
  if (windMul > 0) stepWind(dt);   // the wind keeps blowing through the crash
  stepSun(dt);                     // the sun, the smoke and the dust go on through the crash
  if (dead) {
    gspd = 0;                      // ...but the world no longer scrolls
    cloudX += -airU * 0.3 * dt;
    stepSmoke(dt); stepSand(dt); stepTrail(dt);
    stepAir(dt); stepFeathers(dt); stepDeath(dt); return;
  }
  stepFeathers(dt);
  clock += dt;
  ramp(score);

  // headwind slows the ground speed, tailwind speeds it up (capped)
  const sc = storm > 0 ? WIND.spdCap * 2 + (STORM.spd - WIND.spdCap * 2) * storm
                       : WIND.spdCap * Math.max(1, physMul);
  gspd = speed * (1 + Math.max(-sc, Math.min(sc, airU * WIND.spdPerU)));
  dist += gspd * dt;
  cloudX += (14 - airU * 0.3) * dt;

  // pipes are spaced by DISTANCE, so wind never squeezes two gates together
  since += gspd * dt;
  if (since >= speed * spaceSec) { since = 0; spawn(); }

  if (windMul > 0) {
    curSince += gspd * dt;
    if (curSince >= curNext) { curSince = 0; curNext = randIn(WIND.curGap); spawnCurrent(); }
  }
  for (const c of currents) c.x += (airU * 0.15 - gspd) * dt;
  currents = currents.filter(c => c.x + c.w / 2 > -10);
  for (const c of cacti) c.x -= gspd * dt;
  cacti = cacti.filter(c => c.x + 30 > 0);
  stepSmoke(dt);
  stepSand(dt);

  // what the bird feels: capped lift/sink plus a zero-mean wobble in gusts and at column edges
  windAt(birdX, bird.y);
  const cap = storm > 0 ? WIND.aCap * 2 + (STORM.aCap - WIND.aCap * 2) * storm   // storm: up to 36% of gravity
                        : WIND.aCap * Math.max(1, physMul);
  aBird = Math.max(-cap, Math.min(cap, WA.a));
  let edge = 0;
  for (const c of currents) { const f = currentF(c, birdX); edge = Math.max(edge, 4 * f * (1 - f)); }
  const tm = Math.min(1, gustE + edge) * WIND.turb * physMul;
  let turb = tm * 0.5 * (Math.sin(airClock * 7.3) + Math.sin(airClock * 11.9 + 1.7));
  if (storm > 0) {                 // storm buffeting: slow, heavy, irregular shoves up and down
    const n = (Math.sin(airClock * 2.3) + Math.sin(airClock * 3.9 + 1.1) + Math.sin(airClock * 1.4 + 2.6)) / 3;
    turb += storm * STORM.buffet * (0.5 + 0.8 * gustE) * n;
  }
  // a headwind pushes the bird back, a tailwind forward: a few px, a lot in a storm
  const dr = WIND.drift + (STORM.drift - WIND.drift) * storm;
  const sway = storm * 8 * Math.sin(airClock * 1.7) * (0.4 + gustE);
  const tx = BIRD_X + Math.max(-1, Math.min(1, airU / (45 + 100 * storm))) * dr + sway;
  birdX += (tx - birdX) * (1 - Math.exp(-dt / (0.6 - 0.35 * storm)));
  aFelt = storm > 0 ? aBird + turb : aBird;   // in a storm the autopilot feels the shove it is in

  cooldown -= dt;
  let n = null;
  for (const p of pipes) { if (p.x + PIPE_W > birdX - HW) { n = p; break; } }
  stepHeat(dt);
  stepTrail(dt);
  plowSand();
  if (n && cooldown <= 0 && wantFlap(n)) {
    bird.vy = -flapEff;                          // a cooked bird beats weaker
    flaps++; skin = Math.min(1, skin + HEAT.flap * sunK());
    cooldown = COOLD;
    wingHold = 0.16;
    frameIdx = 0; frameT = 0;
  }

  frameT += dt;
  const rate = cooldown > 0 ? 0.13 : 0.09;
  if (frameT > rate) {
    frameT = 0;
    if (wingHold > 0) wingHold -= rate; else frameIdx = (frameIdx + 1) % 4;
  }

  bird.vy = Math.min(bird.vy + (gEff + aBird + turb) * dt, MAXVY);
  bird.y += bird.vy * dt;

  for (const p of pipes) {
    p.x -= gspd * dt;
    if (!p.passed && p.x + PIPE_W < birdX - HW) { p.passed = true; score++; if (score > best) best = score; }
  }
  pipes = pipes.filter(p => p.x + PIPE_W + CAP_X > -REACH);
  stepAir(dt);                     // after the pipes move, so nothing is left overlapping one

  if (bird.y + HH >= SKY || bird.y - HH <= 0) { die(); return; }
  for (const p of pipes) {
    if (birdX + HW > p.x && birdX - HW < p.x + PIPE_W &&
        (bird.y - HH < p.top || bird.y + HH > p.bot)) { die(); return; }
  }
}

function birdRot() { return bird.vy < -60 ? -0.26 : Math.min(0.80, bird.vy / 620); }

function die() {
  dead = true; deadT = 0; flash = 1;
  deathRot = birdRot();
  bird.vy = 0;
  spawnFeathers(birdX, bird.y);
}

const FEATHER_COLS = [C.birdY, C.birdY, C.birdD, C.birdC, "#ffffff"];
function spawnFeathers(x, y) {
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 70 + Math.random() * 230;
    feathers.push({
      x: x + (Math.random() * 2 - 1) * 8,
      y: y + (Math.random() * 2 - 1) * 6,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 90,           // bias upward so they puff out, then drift down
      rot: Math.random() * Math.PI,
      vr: (Math.random() * 2 - 1) * 9,
      ph: Math.random() * Math.PI * 2,
      fr: 4 + Math.random() * 4,
      len: Math.random() < 0.35 ? 6 : 4,
      col: FEATHER_COLS[(Math.random() * FEATHER_COLS.length) | 0]
    });
  }
}

function stepFeathers(dt) {
  if (!feathers.length) return;
  const drag = Math.exp(-3.2 * dt);
  for (const f of feathers) {
    f.vx *= drag;
    f.vy = Math.min(f.vy * drag + 420 * dt, 55);   // light: low terminal velocity
    f.ph += f.fr * dt;
    windAt(f.x, f.y);                               // carried by the wind
    f.x += (f.vx + Math.sin(f.ph) * 28 + (WA.u - gspd) * 0.9) * dt;   // + side-to-side flutter
    f.y += (f.vy + WA.a * 0.15) * dt;
    f.rot += (f.vr + Math.cos(f.ph) * 3) * dt;
  }
  feathers = feathers.filter(f => f.y < H + 10 && f.x > -20 && f.x < W + 20);
}

function makeBolts() {
  const out = [];
  const n = 3 + ((Math.random() * 3) | 0);
  for (let b = 0; b < n; b++) {
    let a = Math.random() * Math.PI * 2;
    let x = birdX + Math.cos(a) * 8, y = bird.y + Math.sin(a) * 6;
    const pts = [[Math.round(x), Math.round(y)]];
    const segs = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < segs; i++) {
      a += (Math.random() * 2 - 1) * 0.9;
      const l = 6 + Math.random() * 8;
      x += Math.cos(a) * l; y += Math.sin(a) * l;
      pts.push([Math.round(x), Math.round(y)]);
    }
    out.push(pts);
  }
  return out;
}

function stepDeath(dt) {
  deadT += dt;
  if (deadT < D_FREEZE) return;                 // frozen in place
  if (deadT < D_ZAP) {                          // electrocution
    zapT -= dt;
    if (zapT <= 0) {
      zapT = 0.045 + Math.random() * 0.03;
      zapOn = !zapOn;
      bolts = makeBolts();
      jit = [Math.round((Math.random() * 2 - 1) * 2), Math.round((Math.random() * 2 - 1) * 2)];
      if (Math.random() < 0.35) flash = Math.max(flash, 0.45);
    }
    return;
  }
  if (!falling) {                               // flip and drop
    falling = true; bolts = []; zapOn = false; jit = [0, 0];
    bird.vy = -D_HOP;
  }
  bird.vy = Math.min(bird.vy + GRAVITY * dt, 900);
  bird.y += bird.vy * dt;
  if (bird.y - SPR_H > H) { offT += dt; if (offT > D_REST) reset(); }
}

/* ============================================================
   SUMMER - the sun and the shade, heat in the bird, smoke, dust, cacti
   ============================================================ */
function wander(o, dt, lo, hi, every, tau) {          // a value drifting between lo and hi
  o.next -= dt;
  if (o.next <= 0) { o.next = every * (0.6 + 0.8 * Math.random()); o.target = lo + Math.random() * (hi - lo); }
  o.k += (o.target - o.k) * (1 - Math.exp(-dt / tau));
}
function stepSun(dt) {
  sunPh += dt * 2 * Math.PI / SUN.period;
  sunSX = SUN.swing * Math.sin(sunPh);
  wander(dustW, dt, 0.5, 1.7, 10, 3);                  // dust storms come and go
  wander(smokeW, dt, 0.5, 1.5, 14, 5);                 // so does the smoke from the fires
}
function sunXY() { return [W / 2 + sunSX * 112, 48 + 40 * Math.abs(sunSX)]; }   // lower when it leans
/* SHADOWS. A rect [x0,x1] x [ya,yb] shades row y on x0-d*sx .. x1-d*sx for every
   height d it rises toward the sun before reaching the rect (d from y-yb to y-ya).
   The same spans are painted and used for the bird, so the shade you see is the
   shade it feels. Each pipe is shaft + lip, top and bottom; the shafts end at
   the top of the screen and the ground. */
const SPANS = [];                                     // [lo, hi] pairs for one row, reused
function rectShadow(y, x0, x1, ya, yb, out) {
  if (y < ya) return;
  const a = Math.max(0, y - yb) * sunSX, b = (y - ya) * sunSX;
  out.push(x0 - Math.max(a, b), x1 - Math.min(a, b));
}
function pipeShadows(y, p, out) {                     // spans of p's shadow on row y
  const L = p.x, R = p.x + PIPE_W, T = p.top, B = p.bot, n = out.length;
  rectShadow(y, L, R, 0, T - CAP_H, out);
  rectShadow(y, L - CAP_X, R + CAP_X, T - CAP_H, T, out);
  if (out.length - n === 4) {                         // shaft and lip abut: one span
    out[n] = Math.min(out[n], out[n + 2]); out[n + 1] = Math.max(out[n + 1], out[n + 3]); out.length = n + 2;
  }
  const m = out.length;
  rectShadow(y, L - CAP_X, R + CAP_X, B, B + CAP_H, out);
  rectShadow(y, L, R, B + CAP_H, SKY, out);
  if (out.length - m === 4) {
    out[m] = Math.min(out[m], out[m + 2]); out[m + 1] = Math.max(out[m + 1], out[m + 3]); out.length = m + 2;
  }
}
function inShade(x, y) {
  SPANS.length = 0;
  for (const p of pipes) pipeShadows(y, p, SPANS);
  for (let i = 0; i < SPANS.length; i += 2) if (x >= SPANS[i] && x < SPANS[i + 1]) return 1;
  return 0;
}
function heatFx() {                                    // what the heat does to the bird
  const e = Math.min(1, core + 0.6 * skin) ** HEAT.curve;
  flapEff = FLAP * (1 - HEAT.lift * e);
  gEff = GRAVITY * (1 + HEAT.weight * e);
}
function heatE() { return Math.min(1, core + 0.6 * skin); }
function stepHeat(dt) {
  // how much of the bird is in shade: its head, middle and tail feathers
  for (let i = 0; i < 3; i++) LIT[i] = sunMul > 0 && !inShade(birdX, bird.y + LIT_DY[i]);
  shade = 3 - LIT[0] - LIT[1] - LIT[2]; shade /= 3;
  shadeK += (shade - shadeK) * (1 - Math.exp(-dt / 0.12));
  const sun = sunK() * (1.12 - 0.12 * smokeW.k);      // thick smoke takes the edge off
  skin += (HEAT.rate * sun * (1 - shade) - (HEAT.cool * shade + HEAT.air) * skin) * dt;
  skin = Math.max(0, Math.min(1, skin));
  core = Math.min(1, core + HEAT.soak * Math.max(0, skin - HEAT.soakAt) * dt);
  heatFx();
  if (shade < 1 && skin > 0.25 && Math.random() < 9 * (skin - 0.2) * dt)   // sweat flicked off the bird
    sweat.push({ x: birdX + (Math.random() * 2 - 1) * 8, y: bird.y - 4 + Math.random() * 6,
                 vx: -20 - Math.random() * 40, vy: -40 - Math.random() * 50, age: 0 });
  for (const d of sweat) { d.age += dt; d.vy += 420 * dt; d.x += (d.vx - gspd) * dt; d.y += d.vy * dt; }
  sweat = sweat.filter(d => d.y < SKY && d.age < 1.2);
}
/* the bird smokes in proportion to how cooked it is: a wisp when warm, a thick dark
   trail with embers when it is baking. The puffs stay where they were let go (they
   scroll with the world and ride the wind), so the bird leaves a trail behind it. */
const TRAIL_COLS = [[170, 150, 138], [80, 62, 56], [34, 26, 24]];
function stepTrail(dt) {
  const e = dead ? 0 : heatE();
  if (e > 0.06 && Math.random() < (8 + 50 * e) * dt) {
    const c = e < 0.5 ? TRAIL_COLS[0].map((v, i) => v + (TRAIL_COLS[1][i] - v) * e * 2)
                      : TRAIL_COLS[1].map((v, i) => v + (TRAIL_COLS[2][i] - v) * (e - 0.5) * 2);

function fit() {

  const box = stage.getBoundingClientRect();
  if (box.width < 1 || box.height < 1) return;
  const dpr = devicePixelRatio || 1;
  DS = Math.min(box.width / W, box.height / H) * dpr;
  const devW = Math.max(1, Math.floor(W * DS)), devH = Math.max(1, Math.floor(H * DS));
  DS = Math.min(devW / W, devH / H);

    cvs.width = devW; cvs.height = devH;
    cvs.style.width = (devW / dpr) + "px";

      ctx.fillStyle = C.duneShade;
      for (let y = SKY - runH + 5; y < SKY - 2; y += 7)
        for (let x = run; x < x1; x += 2) if (((x + off) >> 1) % 6 === ((y >> 1) % 6)) ctx.fillRect(x, y, 2, 1);
    }
  };
  for (let x = 0; x < W; x += 2) {
    const h = Math.round(groundSandH(x + 1));
    if (h !== runH || run < 0) { flush(x); run = x; runH = h; }
  }
  flush(W);
}
function drawHeatHud() {                           // 4. and spelled out in the corner
  if (sunMul <= 0) { txt("SUN OFF", W - 8, 52, "rgba(255,255,255,.9)", F.hud, "right"); return; }
  const e = heatE(), bw = 64, bx = W - 8 - bw, by = 57;
  const warn = e > 0.7 && (airClock * 4 | 0) % 2 === 0;
  const tcol = warn ? "#ff6b5b" : e > 0.6 ? "#ff8a5a" : e > 0.3 ? "#ffc070" : "rgba(255,255,255,.9)";
  txt("BIRD " + Math.round(104 + 16 * e) + "F", W - 8, 52, tcol, F.hud, "right");
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(bx, by, bw, 5);
  ctx.fillStyle = "#c0301a"; ctx.fillRect(bx, by, Math.round(bw * core), 5);
  ctx.fillStyle = "#ffb03a"; ctx.fillRect(bx + Math.round(bw * core), by, Math.round(bw * Math.min(0.6 * skin, 1 - core)), 5);
  const st = shadeK > 0.5 ? (skin > 0.02 ? "SHADE - COOLING" : "IN THE SHADE") : e > 0.6 ? "BAKING IN SUN" : "IN THE SUN";
  txt(st, W - 8, 78, shadeK > 0.5 ? "#9fe0ff" : "#ffd27a", F.hud, "right");
  const fx = Math.round(100 * (1 - flapEff / FLAP));
  if (fx >= 1) txt("FLAP -" + fx + "%", W - 8, 96, fx > 20 ? "#ff8a5a" : "rgba(255,255,255,.8)", F.hud, "right");
}

function drawBird() {
  const f = FRAMES[frameIdx] || FRAMES[0];
  const pal = dead && zapOn ? SPR_ZAP : heatPal();
  ctx.save();
  if (!dead) {
    ctx.translate(Math.round(birdX), Math.round(bird.y));
    ctx.rotate(birdRot());
  } else if (!falling) {
    ctx.translate(Math.round(birdX) + jit[0], Math.round(bird.y) + jit[1]);
    ctx.rotate(deathRot);
  } else {
    ctx.translate(Math.round(birdX), Math.round(bird.y));
    ctx.scale(1, -1);                            // belly up
    ctx.rotate(Math.min(0.5, (deadT - D_ZAP) * 0.6));
  }
  for (let y = 0; y < BH; y++) {
    for (let x = 0; x < BW; x++) {
      const col = pal[f.charAt(y * BW + x)];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect((x * BS) - (SPR_W >> 1), (y * BS) - (SPR_H >> 1), BS, BS);
    }
  }
  ctx.restore();
}

function drawFeathers() {
  for (const f of feathers) {
    ctx.save();
    ctx.translate(Math.round(f.x), Math.round(f.y));
    ctx.rotate(f.rot);
    ctx.fillStyle = C.ink;
    ctx.fillRect(-(f.len >> 1) - 1, -2, f.len + 2, 4);
    ctx.fillStyle = f.col;
    ctx.fillRect(-(f.len >> 1), -1, f.len, 2);
    ctx.fillStyle = C.birdD;
    ctx.fillRect(-(f.len >> 1), 0, 1, 1);        // quill
    ctx.restore();
  }
}

function boltLine(x0, y0, x1, y1, s, col) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  ctx.fillStyle = col;
  for (let i = 0; i <= n; i++) {
    const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
    ctx.fillRect(x - (s >> 1), y - (s >> 1), s, s);
  }
}

function drawBolts() {
  for (const pts of bolts) {
    for (let i = 1; i < pts.length; i++) boltLine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1], 3, "#5fd8ff");
  }
  for (const pts of bolts) {
    for (let i = 1; i < pts.length; i++) boltLine(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1], 1, "#ffffff");
  }
}

function outlineText(s, x, y, col, font) {
  ctx.font = font;
  const w = ctx.measureText(s).width;
  const x0 = Math.round(x - w / 2), y0 = Math.round(y);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.ink;
  for (const d of [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,1]]) ctx.fillText(s, x0 + d[0], y0 + d[1]);
  ctx.fillStyle = col;
  ctx.fillText(s, x0, y0);
}

function draw() {
  sky();
  drawSun();
  clouds();
  drawSmoke();                                   // far away, behind everything solid
  skyline();
  haze();
  drawCacti();
  groundSand();                                  // over the foot of the cacti, under the shade
  drawShadows();
  for (const p of pipes) {
    pipePart(p.x, 0, p.top, true);
    pipePart(p.x, p.bot, SKY, false);
    pipeSand(p);
  }
  ground();
  groundShadows();
  drawStreaksSwirls();                           // in FRONT of the pipes: the pipes are solid, so
  drawDustLeaves(false);                         // nothing is ever on top of one to need hiding
  if (dead && zapOn && !falling) {               // electric glow behind the bird
    ctx.fillStyle = "rgba(127,232,255,.28)";
    ctx.fillRect(birdX - SPR_W / 2 - 6, bird.y - SPR_H / 2 - 6, SPR_W + 12, SPR_H + 12);
  }
  drawTrail();
  drawBirdAura();
  drawSweat();
  drawBird();
  drawDustLeaves(true);                          // the near leaves pass in front of the bird
  drawBolts();
  drawFeathers();

  outlineText(String(score), W / 2, 78, "#ffffff", F.big);
  if (clearT > 0 && (airClock * 3 | 0) % 2 === 0)       // a gap sanded shut: the wind scours it all away
    outlineText("BLOWN CLEAR", W / 2, 120, "#ffe0a0", F.hud);
  txt("BEST " + best, 8, 16, "rgba(255,255,255,.9)", F.hud, "left");
  txt("SPD " + Math.round(speed) + " GAP " + Math.round(gap), W - 8, 16,
      "rgba(255,255,255,.9)", F.hud, "right");
  drawWindHud();
  if (!dead || offT <= 0) drawHeatHud();

  const k = 1 - Math.exp(-score / TAU);
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillRect(8, 22, 96, 5);
  ctx.fillStyle = C.birdY;
  ctx.fillRect(8, 22, 96 * k, 5);
  if (cooldown > 0 && !dead) {
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillRect(8, 30, 96 * (cooldown / COOLD), 2);
    txt("WING COOLDOWN", 8, 48, "rgba(255,255,255,.75)", F.hud, "left");
  }

  if (dead) {
    ctx.fillStyle = "rgba(255,255,255," + (0.5 * flash) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (dead && offT > 0) {
    ctx.fillStyle = "rgba(20,32,15,.92)";
    ctx.fillRect(W / 2 - 76, H / 2 - 40, 152, 80);
    txt("CRASHED", W / 2, H / 2 - 12, "#ffffff", F.big, "center");
    txt("score " + score, W / 2, H / 2 + 8, "#9fb0bd", F.hud, "center");
    txt("restarting...", W / 2, H / 2 + 26, "#9fb0bd", F.hud, "center");
  }

  /* blit the scene to the display canvas, then draw scanlines in DEVICE
     pixels at an integer period (~1.5 logical px) so the spacing is exact. */
  vctx.drawImage(buf, 0, 0, cvs.width, cvs.height);
  const O = Math.max(3, Math.round(1.5 * DS));
  vctx.fillStyle = "rgba(0,0,0,.15)";
  for (let y = 0; y < cvs.height; y += O) vctx.fillRect(0, y, cvs.width, 1);
}

/* ---------- SUN slider: log scale OFF, x0.1 .. x20 (x20 = scorching) ----------
   Slider 0..1000. The far-left notch is OFF (no heating; the shadows stay); the rest
   is x0.1 * 200^(t/1000), rounded to a readable value, with a detent at the x1
   default. A ?sun= outside the range keeps its real value until the thumb moves. */
const WSL_MIN = 0.1, WSL_MAX = 20, WSL_OFF = 12;
function sliderToWind(t) {
  if (t < WSL_OFF) return 0;
  let w = WSL_MIN * Math.pow(WSL_MAX / WSL_MIN, (t - WSL_OFF) / (1000 - WSL_OFF));
  if (Math.abs(Math.log(w)) < 0.06) return 1;                       // detent at the default
  return w < 1 ? Math.round(w * 100) / 100 : w < 10 ? Math.round(w * 10) / 10 : Math.round(w);
}
function windToSlider(w) {
  if (w <= 0) return 0;
  const t = WSL_OFF + (1000 - WSL_OFF) * Math.log(w / WSL_MIN) / Math.log(WSL_MAX / WSL_MIN);
  return Math.max(WSL_OFF, Math.min(1000, Math.round(t)));
}
function windLabel(w) {
  if (w <= 0) return "off";
  return "x" + w + (w >= 20 ? " scorching" : w > 2 ? " hot" : "");
}
const windIn = document.getElementById("wind"), windOut = document.getElementById("windval");
function showWind() {
  const s = windLabel(sunMul);
  windOut.textContent = s;
  windOut.className = sunMul <= 0 ? "off" : sunMul >= 20 ? "hurricane" : sunMul > 2 ? "storm" : "";
  windIn.setAttribute("aria-valuetext", s);
}
function changeWind(v) {
  if (v === sunMul) return;
  sunMul = v;
  showWind();
  try {                                          // a reload keeps the setting
    const q = new URLSearchParams(location.search); q.set("sun", String(sunMul));
    history.replaceState(null, "", "?" + q.toString() + location.hash);
  } catch (e) {}
}
windIn.value = String(windToSlider(sunMul));
showWind();
windIn.addEventListener("input", () => changeWind(sliderToWind(+windIn.value)));
windIn.addEventListener("keydown", e => {         // 1000 fine steps are for drags; keys move in notches
  const k = e.key, d = k === "ArrowRight" || k === "ArrowUp" ? 25 : k === "ArrowLeft" || k === "ArrowDown" ? -25 :
            k === "PageUp" ? 100 : k === "PageDown" ? -100 : 0;
  if (!d) return;                                 // Home / End keep their native jump to OFF / x20
  e.preventDefault();
  const t = +windIn.value;
  windIn.value = String(Math.max(0, Math.min(1000, d < 0 && t <= WSL_OFF + 25 ? 0 : t + d)));
  changeWind(sliderToWind(+windIn.value));
});
reset();
let acc = 0, last = performance.now();
function loop(now) {
  acc = Math.min(0.25, acc + (now - last) / 1000);
  last = now;
  while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
